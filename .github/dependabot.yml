# A template. Copy to .github/dependabot.yml and delete the ecosystems the
# project does not have.
#
# The grouping is deliberately split by update kind. A single group with
# `patterns: ['*']` across every kind bundles breaking changes with harmless
# bumps, and one broken dependency then blocks the whole stack. Minor and patch
# stay bundled, because reviewing those one by one buys nothing. Major stays
# ungrouped, so that every case arrives on its own.
#
# `cooldown` keeps a version that gets yanked shortly after publication out of
# every pull request.
# Without `timezone` the times are UTC. A project that needs local run times
# enters a suitable IANA time zone of its own.

version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      rust-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  # An entry of its own, because the toolchain affects the entire build and
  # should never share a pull request. `rust-toolchain` is absent from the
  # ecosystem table in GitHub's documentation but stands in the published schema
  # at json.schemastore.org/dependabot-2.0.json.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:05'
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:15'
    open-pull-requests-limit: 5
    cooldown:
      # semver-major-days does not apply to this ecosystem: Dependabot rejects
      # the whole file if it stands here.
      default-days: 3
    groups:
      github-actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
