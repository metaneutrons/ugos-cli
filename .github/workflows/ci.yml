name: CI

on:
  pull_request:
  # Mandatory for the merge queue: a queued pull request is built on a
  # temporary ref, and GitHub reports the required check from that run alone.
  # Without this trigger every entry waits for a "CI Success" that never
  # arrives and falls out of the queue when the response timeout expires.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  quality:
    name: Format, Clippy, Lizenzen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # No dtolnay/rust-toolchain: the version stands in rust-toolchain.toml and
      # rustup installs it from there. Two sources would be one source of error.
      - run: rustup show
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo fmt --all -- --check
      # The lefthook repository has no install.sh. The binary comes from the
      # release asset, pinned like any other dependency.
      - name: Check the hook configuration
        env:
          LEFTHOOK_VERSION: '2.1.12'
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/evilmartians/lefthook/releases/download/v${LEFTHOOK_VERSION}/lefthook_${LEFTHOOK_VERSION}_Linux_x86_64.gz" \
            | gzip -d > "$RUNNER_TEMP/lefthook"
          chmod +x "$RUNNER_TEMP/lefthook"
          "$RUNNER_TEMP/lefthook" validate
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-deny
      - run: cargo deny check

  test:
    name: Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,  runner: ubuntu-24.04 }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm }
          - { name: macos-x86_64,  runner: macos-15-intel }
          - { name: macos-aarch64, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup show
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - run: cargo nextest run --workspace --all-features --locked
      # Measured 2026-09-03: 31.5 % line coverage. The threshold sits just below
      # that so it catches regressions; it claims no good coverage. The large
      # uncovered block is ugos-mcp and everything that needs a real NAS
      # connection.
      - name: Coverage with a hard floor
        if: matrix.name == 'linux-x86_64'
        run: cargo llvm-cov --workspace --all-features --locked --fail-under-lines 31

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Deliberately not rust-toolchain.toml: this job checks the floor declared
      # in Cargo.toml, not the development toolchain.
      - name: Read the floor from Cargo.toml and install it
        run: |
          set -euo pipefail
          msrv=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "MSRV according to Cargo.toml: $msrv"
          rustup toolchain install "$msrv" --profile minimal
          rustup default "$msrv"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo build --workspace --locked

  commit-hygiene:
    name: Commit-Hygiene
    # There is no pull request in a merge_group run, and the title was already
    # checked on the way into the queue. `ci-success` accepts a skipped job, so
    # the required check still reports.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check the title, the body and every commit
        # Title and body reach the script through env only, never by
        # interpolation into the script text: otherwise the PR title would be a
        # shell injection vector.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          status=0
          cc='^((feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+|Revert ".+")'
          # grep works line by line, hence .* rather than [^\n]*: in ERE [^\n]
          # would be the class "no backslash and no n" and would exclude names
          # containing 'n'. In the ruleset's RE2 rule [^\n] is right instead.
          ban='co-authored-by:.*(claude|anthropic)|generated with.*claude code'

          # On a squash merge the PR title becomes the subject line on main and
          # therefore decides the next version.
          if ! printf '%s' "$PR_TITLE" | grep -Eq "$cc"; then
            echo "::error::the PR title does not follow Conventional Commits: $PR_TITLE"
            status=1
          fi

          # With squash_merge_commit_message=PR_BODY the body lands in the commit.
          if printf '%s' "$PR_BODY" | grep -Eiq "$ban"; then
            echo "::error::the PR body carries an AI attribution trailer."
            status=1
          fi

          for sha in $(git rev-list "${BASE_SHA}..${HEAD_SHA}"); do
            if git log -1 --format=%B "$sha" | grep -Eiq "$ban"; then
              echo "::error::commit $sha carries an AI attribution trailer."
              status=1
            fi
            email=$(git log -1 --format='%ae%n%ce' "$sha")
            if printf '%s' "$email" | grep -Fq 'noreply@anthropic.com'; then
              echo "::error::commit $sha has an Anthropic address as author or committer."
              status=1
            fi
          done

          if [ "$status" -ne 0 ]; then
            echo "::notice::turn this off for good in ~/.claude/settings.json: {\"attribution\":{\"commit\":\"\",\"pr\":\"\"}}"
            exit 1
          fi

  secrets:
    name: Secret-Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # The pre-push hook scans only the new commits. The full scan over the
      # history belongs here, or the reasoning in commits.md is hollow.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # Required since the action's breaking change, or it aborts on every
          # pull request. The automatically issued token is enough.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # If required for organisation use: a narrowly scoped CI tooling
          # secret, never one from a publish environment.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # The only required check in the ruleset. Matrix changes therefore do not
  # break the repository configuration.
  ci-success:
    name: CI Success
    if: always()
    needs: [quality, test, msrv, secrets, commit-hygiene]
    runs-on: ubuntu-24.04
    steps:
      - name: Every preceding job must have succeeded or been skipped
        run: |
          set -euo pipefail
          printf '%s\n' '${{ toJSON(needs) }}' |
            jq -e 'all(.[]; .result == "success" or .result == "skipped")'
