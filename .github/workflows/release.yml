name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to build and publish.
        required: true
        type: string
    # Alle als optional deklariert, auch der Homebrew-Token. Die Werte liegen
    # im Environment "release", nicht als Repository-Secrets, und `secrets:
    # inherit` reicht nur Repository- und Organisations-Secrets weiter. Ein
    # `required: true` laesst deshalb jeden Job scheitern, der kein
    # `environment: release` fuehrt, noch bevor er etwas tut. Die Jobs, die den
    # Token brauchen, holen ihn ueber ihr Environment; preflight prueft ihn
    # dort, bevor irgendetwas Oeffentliches geschieht.
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false
      AUR_SSH_PRIVATE_KEY:
        required: false
      APT_ARCHIVE_DISPATCH_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish.
        required: true
        type: string

# Jobs that need more opt in explicitly.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Validate release identity and credentials
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    outputs:
      version: ${{ steps.identity.outputs.version }}
      source_date_epoch: ${{ steps.identity.outputs.source_date_epoch }}
      publish_apt: ${{ steps.channels.outputs.apt }}
      publish_aur: ${{ steps.channels.outputs.aur }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Derive an immutable version and build timestamp
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::UG7001 tag must be a canonical vX.Y.Z release tag: $RELEASE_TAG"
            exit 1
          fi
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ "$manifest" != "$version" ]]; then
            echo "::error::UG7002 tag $RELEASE_TAG does not match Cargo.toml version $manifest"
            exit 1
          fi
          # Deterministic builds need a fixed clock; the tagged commit is it.
          epoch=$(git log -1 --pretty=%ct)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$epoch" >> "$GITHUB_OUTPUT"
      - name: Verify the Homebrew tap credential before any public change
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::UG7010 HOMEBREW_TAP_TOKEN is missing"
            exit 1
          fi
          permission=$(gh api repos/metaneutrons/homebrew-tap --jq '.permissions.push')
          if [[ "$permission" != true ]]; then
            echo "::error::UG7011 the tap credential cannot write metaneutrons/homebrew-tap"
            exit 1
          fi
      - name: Decide which package channels are configured
        id: channels
        env:
          APT_ARCHIVE_DISPATCH_TOKEN: ${{ secrets.APT_ARCHIVE_DISPATCH_TOKEN }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_SSH_KNOWN_HOSTS: ${{ vars.AUR_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          # A channel runs only when fully configured. Missing configuration
          # skips it; partial configuration is an error, because it usually
          # means a secret was renamed and would fail halfway through.
          #
          # Auf stdout steht nichts als true oder false. Die Ausgabe wandert
          # in eine Zuweisung in GITHUB_OUTPUT, und eine zweite Zeile macht
          # daraus einen mehrzeiligen Wert, den das Dateikommando ablehnt.
          # Meldungen gehen deshalb nach stderr; im Log stehen sie genauso.
          # Nur noch der Dispatch-Token: Signaturschluessel und R2-Zugang
          # liegen im Archiv-Repository, nicht hier.
          apt_names=(APT_ARCHIVE_DISPATCH_TOKEN)
          aur_names=(AUR_SSH_PRIVATE_KEY AUR_SSH_KNOWN_HOSTS)

          decide() {
            local channel=$1; shift
            local present=0 missing=0 name
            for name in "$@"; do
              if [[ -n "${!name:-}" ]]; then present=$((present + 1)); else missing=$((missing + 1)); fi
            done
            if (( present == 0 )); then
              echo "::notice::$channel is not configured and will be skipped" >&2
              printf 'false'
            elif (( missing > 0 )); then
              echo "::error::UG7020 $channel is only partly configured; $missing value(s) missing" >&2
              return 1
            else
              printf 'true'
            fi
          }

          # Zuweisung und Aufruf muessen getrennt stehen. In der Form
          # echo "apt=$(decide ...)" bleibt ein Fehlschlag von decide folgenlos,
          # weil der Exit-Status der von echo ist; ein nur halb konfigurierter
          # Kanal liefe dann trotz UG7020 weiter.
          apt=$(decide APT "${apt_names[@]}")
          aur=$(decide AUR "${aur_names[@]}")
          echo "apt=$apt" >> "$GITHUB_OUTPUT"
          echo "aur=$aur" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: [preflight]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
      # Kein dtolnay/rust-toolchain: die Version steht in rust-toolchain.toml
      # und rustup installiert sie daraus, genau wie in der CI. Die Aktion
      # haengt den Zieltriple sonst an die aktuelle stable, waehrend cargo im
      # Repo die festgelegte Toolchain benutzt. Beim Cross-Build fehlt dort
      # dann die Standardbibliothek, und rustc bricht mit E0463 ab.
      - run: rustup show
      - name: Zieltriple zur festgelegten Toolchain hinzufuegen
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} -p ugos-cli -p ugos-mcp
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          tar czf ../../../ugos-cli-${{ matrix.target }}.tar.gz ugos-cli ugos-mcp
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          7z a ../../../ugos-cli-${{ matrix.target }}.zip ugos-cli.exe ugos-mcp.exe
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ugos-cli-${{ matrix.target }}
          path: |
            ugos-cli-${{ matrix.target }}.tar.gz
            ugos-cli-${{ matrix.target }}.zip

  package-deb:
    name: Debian package (${{ matrix.arch }})
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Die Attestierung bindet die .deb an die Identitaet dieses Workflows.
    # metaneutrons/apt-archive prueft sie mit `gh attestation verify` und
    # bricht ohne sie ab, absichtlich: ein Konto mit Upload-Recht ist kein
    # Nachweis darueber, was die Datei gebaut hat.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ugos-cli-${{ matrix.target }}
          path: ./archives
      - name: Build the package from the released archive
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ needs.preflight.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          scripts/release/build-deb.sh \
            --archive "./archives/ugos-cli-${{ matrix.target }}.tar.gz" \
            --arch "${{ matrix.arch }}" \
            --version "$VERSION" \
            --output-dir ./debs \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
      - name: Verify the package installs and runs
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          deb="./debs/ugos-cli_${VERSION}_${{ matrix.arch }}.deb"
          dpkg-deb --contents "$deb"
          # Only the native architecture can actually be installed here.
          if [[ "${{ matrix.arch }}" == amd64 ]]; then
            sudo dpkg -i "$deb"
            installed=$(ugos-cli --version)
            [[ "$installed" == "ugos ${VERSION}" ]] || {
              echo "::error::UG7310 installed binary reports '$installed'"; exit 1; }
            # ugos-mcp speaks MCP on stdio and has no --version to ask, so
            # only its presence and mode are checked here.
            [[ -x /usr/bin/ugos-mcp ]] || {
              echo "::error::UG7311 ugos-mcp is missing or not executable"; exit 1; }
            sudo dpkg -r ugos-cli
          fi
      # Vor dem Upload: die Attestierung haengt am Digest, nicht am Ort, und
      # gilt damit auch fuer die Kopie, die spaeter am Release haengt.
      - name: Attest the package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ./debs/*.deb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ugos-cli-deb-${{ matrix.arch }}
          path: ./debs/*.deb

  upload-release-artifacts:
    name: Upload Release Artifacts
    needs: [build, package-deb]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          # Bleibt ein Entwurf: release-please legt das Release als Draft an,
          # und sichtbar wird es erst, wenn jedes Artefakt daran haengt.
          draft: true
          files: |
            ugos-cli-*/*.tar.gz
            ugos-cli-*/*.zip
            ugos-cli-deb-*/*.deb

  # Steht bewusst vor den Paketkanaelen. Homebrew und AUR laden in ihrem
  # eigenen Test von der Release-URL, und die Assets eines Entwurfs sind
  # unauthentifiziert nicht erreichbar: ein Kanal als Vorbedingung der
  # Veroeffentlichung waere zirkulaer. Der Entwurf schuetzt weiterhin davor,
  # dass ein Release sichtbar wird, bevor seine Artefakte daran haengen.
  publish-release:
    name: Publish the release
    needs: [preflight, upload-release-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Entwurf sichtbar machen
        run: |
          set -euo pipefail
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$state" != true ]; then
            echo "::notice::Release $TAG ist bereits veroeffentlicht"
            exit 0
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          # Zuruecklesen statt dem Rueckgabewert vertrauen.
          after=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          [ "$after" = false ] || { echo "::error::Release $TAG ist weiterhin ein Entwurf"; exit 1; }

  publish-apt:
    name: Ask the archive to publish
    needs: [preflight, publish-release]
    if: needs.preflight.outputs.publish_apt == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      ARCHIVE_REPO: metaneutrons/apt-archive
      ARCHIVE_DOMAIN: metaneutrons.cc
      ARCHIVE_PROJECT: ugos-cli
      ARCHIVE_BASE_URL: https://deb.metaneutrons.cc/ugos-cli
    steps:
      # Dieses Repository laedt nichts hoch und haelt keinen Signaturschluessel.
      # Ein R2-Token laesst sich auf einen Bucket begrenzen, nicht auf ein
      # Praefix; ein Schreibzugang je Projekt waere ein Schreibzugang auf das
      # ganze Archiv. Die .deb haengen attestiert am Release, und das Archiv
      # holt sie sich.
      - name: Anklopfen
        env:
          GH_TOKEN: ${{ secrets.APT_ARCHIVE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          # Als JSON-Rumpf statt als -f-Felder: der Payload ist verschachtelt,
          # und die Feldsyntax waere hier eine Fehlerquelle ohne Gewinn.
          jq -n --arg domain "$ARCHIVE_DOMAIN" --arg project "$ARCHIVE_PROJECT" \
            '{event_type: "publish-archive",
              client_payload: {domain: $domain, project: $project}}' \
            | gh api -X POST "repos/${ARCHIVE_REPO}/dispatches" --input -
          echo "::notice::${ARCHIVE_REPO} um Veroeffentlichung von ${ARCHIVE_PROJECT} gebeten"

      # Der Dispatch liefert keine Lauf-ID zurueck. Geprueft wird deshalb das
      # Ergebnis an der oeffentlichen URL, und das ist ohnehin die staerkere
      # Aussage: nicht dass ein Lauf startete, sondern dass das Archiv die
      # Version ausliefert.
      #
      # Der Debian-Versionsstring traegt eine Revision, `build-deb.sh` setzt
      # `${version}-1`. Verglichen wird deshalb der Upstream-Teil als Praefix,
      # als Zeichenkette und nicht als regulaerer Ausdruck: die Punkte einer
      # Version waeren dort Platzhalter.
      - name: Warten, bis das Archiv die Version ausliefert
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pick.awk" <<'AWK'
          BEGIN { prefix = version "-" }
          $1 == "Package:"  { pkg  = $2 }
          $1 == "Version:"  { ver  = $2 }
          $1 == "Filename:" { name = $2 }
          function hit() { return pkg == package && substr(ver, 1, length(prefix)) == prefix }
          # awk fuehrt END auch nach exit aus, deshalb die Marke.
          /^[[:space:]]*$/ { if (hit()) { print name; done = 1; exit } pkg = ""; ver = ""; name = "" }
          END { if (!done && hit()) print name }
          AWK

          # Ohne Cache-Buster: die Cache Rule der Zone setzt fuer dists/**
          # `Cache-Control: no-store`, gerade damit ein alter Index nicht gegen
          # ein neues InRelease laufen kann.
          index="${ARCHIVE_BASE_URL}/dists/rolling/main/binary-amd64/Packages.gz"
          deadline=$(( SECONDS + 1200 ))
          while :; do
            if curl --fail --silent --show-error --location "$index" --output packages.gz 2>/dev/null; then
              found=$(gzip -dc packages.gz \
                | awk -v package=ugos-cli -v version="$VERSION" -f "$RUNNER_TEMP/pick.awk")
              if [[ -n "$found" ]]; then
                echo "::notice::${ARCHIVE_BASE_URL} liefert ${VERSION} als ${found}"
                break
              fi
            fi
            if (( SECONDS > deadline )); then
              echo "::error::UG7430 das Archiv liefert ${VERSION} nicht innerhalb der Frist; der Dispatch ging raus, die Ursache steht in den Laeufen von ${ARCHIVE_REPO}"
              exit 1
            fi
            sleep 30
          done

      # Ein Index, der die Version nennt, ist noch keine ausgelieferte Datei.
      - name: Das ausgelieferte Paket gegen das Release vergleichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            curl --fail --silent --show-error --location \
              "${ARCHIVE_BASE_URL}/dists/rolling/main/binary-${arch}/Packages.gz" \
              --output "packages-${arch}.gz"
            filename=$(gzip -dc "packages-${arch}.gz" \
              | awk -v package=ugos-cli -v version="$VERSION" -f "$RUNNER_TEMP/pick.awk")
            if [[ -z "$filename" ]]; then
              echo "::error::UG7431 der Index fuer ${arch} nennt keine Datei zu ${VERSION}"
              exit 1
            fi
            curl --fail --silent --show-error --location \
              "${ARCHIVE_BASE_URL}/${filename}" --output "published-${arch}.deb"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "ugos-cli_${VERSION}_${arch}.deb" --dir ./release --clobber
            cmp "published-${arch}.deb" "./release/ugos-cli_${VERSION}_${arch}.deb"
            echo "::notice::${arch} identisch mit dem Release-Asset"
          done

  update-homebrew:
    name: Update Homebrew Tap
    needs: [preflight, build, publish-release]
    runs-on: ubuntu-latest
    environment: release
    # Die Qualifikation im Tap fuehrt brew install und brew test auf zwei
    # macOS-Runnern aus. Das dauert, und der Job wartet darauf.
    timeout-minutes: 60
    env:
      TAP_REPO: metaneutrons/homebrew-tap
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ./artifacts
      - name: Update the tap formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail

          checksum() {
            local target=$1
            local path="./artifacts/ugos-cli-${target}/ugos-cli-${target}.tar.gz"
            if [[ ! -f "$path" ]]; then
              echo "::error::UG7500 release archive is missing: $path" >&2
              exit 1
            fi
            sha256sum "$path" | cut -d' ' -f1
          }

          MAC_X64_SHA=$(checksum x86_64-apple-darwin)
          MAC_ARM64_SHA=$(checksum aarch64-apple-darwin)
          LINUX_X64_SHA=$(checksum x86_64-unknown-linux-gnu)
          LINUX_ARM64_SHA=$(checksum aarch64-unknown-linux-gnu)

          # Ohne version-Zeile: brew audit --strict verwirft sie als redundant,
          # weil Homebrew die Version aus der URL liest. Genau deshalb wurde
          # sie im Tap mit "fix(ugos-cli): satisfy current Homebrew audit"
          # (44866ec) entfernt, und die Formel darf sie nicht zurueckbringen.
          cat > formula.rb <<RUBY
          class UgosCli < Formula
            desc "CLI and MCP server for UGREEN NAS (UGOS) management"
            homepage "https://github.com/metaneutrons/ugos-cli"
            license "GPL-3.0-or-later"

            on_macos do
              if Hardware::CPU.intel?
                url "https://github.com/metaneutrons/ugos-cli/releases/download/v${VERSION}/ugos-cli-x86_64-apple-darwin.tar.gz"
                sha256 "${MAC_X64_SHA}"
              else
                url "https://github.com/metaneutrons/ugos-cli/releases/download/v${VERSION}/ugos-cli-aarch64-apple-darwin.tar.gz"
                sha256 "${MAC_ARM64_SHA}"
              end
            end

            on_linux do
              if Hardware::CPU.intel?
                url "https://github.com/metaneutrons/ugos-cli/releases/download/v${VERSION}/ugos-cli-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${LINUX_X64_SHA}"
              else
                url "https://github.com/metaneutrons/ugos-cli/releases/download/v${VERSION}/ugos-cli-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${LINUX_ARM64_SHA}"
              end
            end

            def install
              bin.install "ugos-cli"
              bin.install "ugos-mcp"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/ugos-cli --version")
            end
          end
          RUBY

          ruby -c formula.rb
          if [[ $(grep -Fc "/releases/download/v${VERSION}/" formula.rb) != 4 ]]; then
            echo "::error::UG7501 formula does not reference four exact release URLs"
            exit 1
          fi

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          install -d tap/Formula
          install -m 0644 formula.rb tap/Formula/ugos-cli.rb
          cd tap
          # Die Qualifikation im Tap prueft auch, dass README.md aus den
          # Formeln erzeugt wurde. Ohne diesen Lauf scheitert der Pull Request
          # an dieser Pruefung statt an der Formel.
          scripts/generate-readme.sh README.md
          if [[ -z $(git status --porcelain) ]]; then
            echo "::notice::the tap already carries this formula"
            exit 0
          fi

          # main des Taps ist geschuetzt: Pull Request und der Check
          # "Formula qualification" sind Pflicht, ein Direkt-Push wird
          # abgewiesen. Reviews verlangt der Tap keine.
          branch="ugos-cli-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Formula/ugos-cli.rb README.md
          git commit -m "Update ugos-cli to ${VERSION}"
          git push --force-with-lease origin "$branch"

          pr=$(gh pr list --repo "$TAP_REPO" --head "$branch" --state open \
                 --json number --jq '.[0].number // empty')
          if [[ -z "$pr" ]]; then
            url=$(gh pr create --repo "$TAP_REPO" --base main --head "$branch" \
                    --title "Update ugos-cli to ${VERSION}" \
                    --body "Formel-Bump aus dem Release-Lauf von ugos-cli v${VERSION}.")
            pr=${url##*/}
          fi
          if [[ ! "$pr" =~ ^[0-9]+$ ]]; then
            echo "::error::UG7502 no pull request number for $branch"
            exit 1
          fi
          echo "::notice::tap pull request #$pr"

          # Der Gate-Job laeuft mit "if: always()" nach den Lanes, taucht als
          # Check-Run also erst spaet auf. Ein fehlender Eintrag ist deshalb
          # kein Fehler, sondern heisst warten.
          #
          # Gefragt wird die Rollup-Sicht der Pull Request, nicht
          # commits/<sha>/check-runs: bei pull_request-Ereignissen haengen die
          # Check-Runs am Merge-Commit, nicht am Kopf des Zweiges. Die Rollup
          # antwortet in Grossbuchstaben, die REST-Sicht in Kleinbuchstaben,
          # deshalb wird beides kleingeschrieben verglichen.
          deadline=$(( SECONDS + 2400 ))
          while :; do
            info=$(gh pr view "$pr" --repo "$TAP_REPO" --json statusCheckRollup \
              --jq '[.statusCheckRollup[] | select(.name == "Formula qualification")] | last
                    | if . == null then "absent none"
                      else "\((.status // "absent") | ascii_downcase) \((.conclusion // "none") | ascii_downcase)" end')
            if [[ "${info%% *}" == completed ]]; then
              if [[ "${info##* }" == success ]]; then
                break
              fi
              echo "::error::UG7503 Formula qualification ended with ${info##* }"
              exit 1
            fi
            if (( SECONDS > deadline )); then
              echo "::error::UG7504 Formula qualification did not finish in time"
              exit 1
            fi
            sleep 20
          done

          gh pr merge "$pr" --repo "$TAP_REPO" --squash --delete-branch
      - name: Verify the formula now on the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          published=$(gh api \
            "repos/${TAP_REPO}/contents/Formula/ugos-cli.rb?ref=main" \
            --jq .content | base64 --decode)
          # Die Formel fuehrt keine version-Zeile, die Version steht in den
          # vier Release-URLs. Dort wird sie geprueft, nicht anderswo.
          if [[ $(grep -Fc "/releases/download/v${VERSION}/" <<< "$published") != 4 ]]; then
            echo "::error::UG7505 the tap does not serve version ${VERSION}"
            exit 1
          fi

  publish-aur:
    name: Publish AUR package
    needs: [preflight, build, publish-release]
    if: needs.preflight.outputs.publish_aur == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      AUR_SSH_KNOWN_HOSTS: ${{ vars.AUR_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ./artifacts
      - name: Write the PKGBUILD
        run: |
          set -euo pipefail
          x86=$(sha256sum ./artifacts/ugos-cli-x86_64-unknown-linux-gnu/ugos-cli-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          arm=$(sha256sum ./artifacts/ugos-cli-aarch64-unknown-linux-gnu/ugos-cli-aarch64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          base="https://github.com/metaneutrons/ugos-cli/releases/download/v${VERSION}"
          cat > PKGBUILD <<PKG
          # Maintainer: Fabian Schmieder <fabian@schmieder.eu>
          pkgname=ugos-cli-bin
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="CLI and MCP server for UGREEN NAS (UGOS) management"
          arch=('x86_64' 'aarch64')
          url="https://github.com/metaneutrons/ugos-cli"
          license=('GPL-3.0-or-later')
          provides=('ugos-cli')
          conflicts=('ugos-cli')
          source_x86_64=("\${pkgname}-\${pkgver}-x86_64.tar.gz::${base}/ugos-cli-x86_64-unknown-linux-gnu.tar.gz")
          source_aarch64=("\${pkgname}-\${pkgver}-aarch64.tar.gz::${base}/ugos-cli-aarch64-unknown-linux-gnu.tar.gz")
          sha256sums_x86_64=('${x86}')
          sha256sums_aarch64=('${arm}')

          package() {
            install -Dm755 "\${srcdir}/ugos-cli" "\${pkgdir}/usr/bin/ugos-cli"
            install -Dm755 "\${srcdir}/ugos-mcp" "\${pkgdir}/usr/bin/ugos-mcp"
          }
          PKG
          sed -i 's/^          //' PKGBUILD
          cat PKGBUILD
      - name: Build the package and verify it against the release archive
        run: |
          set -euo pipefail
          docker run --rm --user root \
            --volume "$PWD:/pkg" --workdir /pkg \
            archlinux:base-devel@sha256:a26046b7363dad8e2614858f4313949ae9b05c9c5f31de343a54864b9e20806f \
            bash -euo pipefail -c '
              useradd -m builder
              chown -R builder:builder /pkg
              su builder -c "makepkg --printsrcinfo > .SRCINFO"
              su builder -c "makepkg --cleanbuild --noconfirm --nocheck"
            '
          package=$(find . -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)
          if [[ -z "$package" ]]; then
            echo "::error::UG7600 makepkg produced no package"
            exit 1
          fi
          mkdir -p /tmp/from-package /tmp/from-archive
          tar -xf "$package" -C /tmp/from-package
          tar -xzf ./artifacts/ugos-cli-x86_64-unknown-linux-gnu/ugos-cli-x86_64-unknown-linux-gnu.tar.gz \
            -C /tmp/from-archive
          for binary in ugos-cli ugos-mcp; do
            cmp "/tmp/from-archive/$binary" "/tmp/from-package/usr/bin/$binary"
          done
      - name: Push to the AUR
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          install -m 0600 /dev/null "$RUNNER_TEMP/ssh/aur"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/aur"
          printf '%s\n' "$AUR_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/ssh/aur -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts"
          git -c init.defaultBranch=master clone \
            ssh://aur@aur.archlinux.org/ugos-cli-bin.git "$RUNNER_TEMP/aur"
          install -m 0644 PKGBUILD "$RUNNER_TEMP/aur/PKGBUILD"
          install -m 0644 .SRCINFO "$RUNNER_TEMP/aur/.SRCINFO"
          cd "$RUNNER_TEMP/aur"
          if [[ -z $(git status --short) ]]; then
            echo "::notice::the AUR already carries this version"
            exit 0
          fi
          git config user.name 'ugos-cli release automation'
          git config user.email 'fabian@schmieder.eu'
          git add PKGBUILD .SRCINFO
          git commit -m "ugos-cli-bin ${VERSION}-1"
          git push origin HEAD:master
