name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to build and publish.
        required: true
        type: string
    secrets:
      HOMEBREW_UPDATE_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish.
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} -p ugos-cli -p ugos-mcp
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../ugos-cli-${{ matrix.target }}.tar.gz ugos-cli ugos-mcp
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../ugos-cli-${{ matrix.target }}.zip ugos-cli.exe ugos-mcp.exe
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ugos-cli-${{ matrix.target }}
          path: |
            ugos-cli-${{ matrix.target }}.tar.gz
            ugos-cli-${{ matrix.target }}.zip

  upload-release-artifacts:
    name: Upload Release Artifacts
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag }}
          files: ugos-cli-*/*

  update-homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: [build, upload-release-artifacts]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ./artifacts
      - name: Calculate checksums and update tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_UPDATE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"

          MAC_X64_SHA=$(sha256sum ./artifacts/ugos-cli-x86_64-apple-darwin/ugos-cli-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)
          MAC_ARM64_SHA=$(sha256sum ./artifacts/ugos-cli-aarch64-apple-darwin/ugos-cli-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)
          LINUX_X64_SHA=$(sha256sum ./artifacts/ugos-cli-x86_64-unknown-linux-gnu/ugos-cli-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          LINUX_ARM64_SHA=$(sha256sum ./artifacts/ugos-cli-aarch64-unknown-linux-gnu/ugos-cli-aarch64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/metaneutrons/homebrew-tap.git"
          cd homebrew-tap
          mkdir -p Formula

          cat > Formula/ugos-cli.rb <<RUBY
          class UgosCli < Formula
            desc "CLI and MCP server for UGREEN NAS (UGOS) management"
            homepage "https://github.com/metaneutrons/ugos-cli"
            version "${VERSION}"
            license "GPL-3.0"

            on_macos do
              if Hardware::CPU.intel?
                url "https://github.com/metaneutrons/ugos-cli/releases/download/v${VERSION}/ugos-cli-x86_64-apple-darwin.tar.gz"
                sha256 "${MAC_X64_SHA}"
              else
                url "https://github.com/metaneutrons/ugos-cli/releases/download/v${VERSION}/ugos-cli-aarch64-apple-darwin.tar.gz"
                sha256 "${MAC_ARM64_SHA}"
              end
            end

            on_linux do
              if Hardware::CPU.intel?
                url "https://github.com/metaneutrons/ugos-cli/releases/download/v${VERSION}/ugos-cli-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${LINUX_X64_SHA}"
              else
                url "https://github.com/metaneutrons/ugos-cli/releases/download/v${VERSION}/ugos-cli-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${LINUX_ARM64_SHA}"
              end
            end

            def install
              bin.install "ugos-cli"
              bin.install "ugos-mcp"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/ugos-cli --version")
            end
          end
          RUBY

          # Remove heredoc indentation
          sed -i 's/^          //' Formula/ugos-cli.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ugos-cli.rb
          git commit -m "Update ugos-cli to ${VERSION}"
          git push

