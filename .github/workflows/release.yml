name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to build and publish.
        required: true
        type: string
    # Alle als optional deklariert, auch der Homebrew-Token. Die Werte liegen
    # im Environment "release", nicht als Repository-Secrets, und `secrets:
    # inherit` reicht nur Repository- und Organisations-Secrets weiter. Ein
    # `required: true` laesst deshalb jeden Job scheitern, der kein
    # `environment: release` fuehrt, noch bevor er etwas tut. Die Jobs, die den
    # Token brauchen, holen ihn ueber ihr Environment; preflight prueft ihn
    # dort, bevor irgendetwas Oeffentliches geschieht.
    secrets:
      HOMEBREW_APP_PRIVATE_KEY:
        required: false
      AUR_SSH_PRIVATE_KEY:
        required: false
      ARCHIVE_DISPATCH_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish.
        required: true
        type: string

# Jobs that need more opt in explicitly.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Stufe 1. Identitaet feststellen. Bewusst ohne Environment und ohne
  # Secrets: dieser Job muss auch fuer einen Prerelease-Tag laufen, und er
  # veraendert nichts.
  metadata:
    name: Release-Identitaet feststellen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      source_date_epoch: ${{ steps.identity.outputs.source_date_epoch }}
      is_prerelease: ${{ steps.identity.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Version, Vorabkennung und Bauzeit ableiten
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::UG7001 tag must be a canonical vX.Y.Z release tag: $RELEASE_TAG"
            exit 1
          fi
          # Der Release-Kern ohne Vorabsuffix. Nur er steht in Cargo.toml und
          # nur er darf in Arch' pkgver landen, wo ein Bindestrich verboten
          # ist. Die Release-Identitaet bleibt der vollstaendige Tag, aus dem
          # jede Download-URL gebaut wird.
          version="${RELEASE_TAG#v}"
          core="${version%%-*}"
          if [[ "$core" == "$version" ]]; then
            is_prerelease=false
          else
            is_prerelease=true
          fi
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ "$manifest" != "$core" ]]; then
            echo "::error::UG7002 tag $RELEASE_TAG does not match Cargo.toml version $manifest"
            exit 1
          fi
          if [[ "$(git rev-parse "${RELEASE_TAG}^{}")" != "$GITHUB_SHA" ]]; then
            echo "::error::UG7003 tag $RELEASE_TAG does not point at the commit this run builds from"
            exit 1
          fi
          # Deterministic builds need a fixed clock; the tagged commit is it.
          epoch=$(git log -1 --pretty=%ct)
          {
            echo "version=$core"
            echo "source_date_epoch=$epoch"
            echo "is_prerelease=$is_prerelease"
          } >> "$GITHUB_OUTPUT"
      - name: Ein bereits veroeffentlichtes Release nicht mehr anfassen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Der Entwurf von release-please ist der Normalfall. Ein Release,
          # das bereits ausgeliefert ist, wird nicht ueberschrieben: dessen
          # Metadaten liegen schon bei den Nutzern.
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo absent)
          case "$state" in
            absent) echo "::notice::kein Release unter $TAG, Stufe 7 legt einen Entwurf an" ;;
            true)   echo "::notice::Entwurf unter $TAG vorhanden" ;;
            false)  echo "::error::UG7004 release $TAG is already published"; exit 1 ;;
            *)      echo "::error::UG7005 unexpected release state for $TAG: $state"; exit 1 ;;
          esac

  # Stufe 6. Kanal-Preflight. Prueft ausschliesslich Zugaenge, veraendert
  # nichts. Ein Vorabtag erreicht Stufe 8 nie und braucht die Zugaenge nicht,
  # deshalb faellt dieser Job dort bewusst weg.
  channel-preflight:
    name: Kanal-Zugaenge pruefen
    needs: [metadata]
    if: needs.metadata.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      publish_apt: ${{ steps.channels.outputs.apt }}
      publish_aur: ${{ steps.channels.outputs.aur }}
      publish_crates: ${{ steps.crates.outputs.crates }}
    steps:
      # Ein Token mit ausdruecklichen Rechte-Eingaben. Fehlt der Installation
      # eines davon, scheitert schon die Praegung; ein spaeteres Scheitern
      # mitten im Schreiben waere der schlechtere Ort.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: tap-token
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: metaneutrons
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
          permission-checks: read
          permission-statuses: read
          permission-administration: read
      - name: Die Installation pruefen, nicht die Rolle des Aufrufers
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          set -euo pipefail
          # `permissions.push` einer Repository-Antwort beschreibt die Rolle
          # des Aufrufers, nicht die Zusage der Installation. Gefragt wird
          # deshalb, was die Installation tatsaechlich erreicht.
          reached=$(gh api installation/repositories --jq '[.repositories[].full_name] | sort | join(",")')
          if [[ "$reached" != "metaneutrons/homebrew-tap" ]]; then
            echo "::error::UG7011 die Installation erreicht '$reached' statt genau metaneutrons/homebrew-tap"
            exit 1
          fi
          # Der Bot ueber seinen oeffentlichen Endpunkt. `/user` gilt fuer ein
          # Installations-Token nicht und antwortete irrefuehrend.
          bot=$(gh api "users/metaneutrons-homebrew%5Bbot%5D" --jq '"\(.login) \(.id)"')
          echo "::notice::Installation erreicht $reached, Bot $bot"
      - name: Decide which package channels are configured
        id: channels
        env:
          ARCHIVE_DISPATCH_CLIENT_ID: ${{ vars.ARCHIVE_DISPATCH_CLIENT_ID }}
          ARCHIVE_DISPATCH_PRIVATE_KEY: ${{ secrets.ARCHIVE_DISPATCH_PRIVATE_KEY }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_SSH_KNOWN_HOSTS: ${{ vars.AUR_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          # A channel runs only when fully configured. Missing configuration
          # skips it; partial configuration is an error, because it usually
          # means a secret was renamed and would fail halfway through.
          #
          # Auf stdout steht nichts als true oder false. Die Ausgabe wandert
          # in eine Zuweisung in GITHUB_OUTPUT, und eine zweite Zeile macht
          # daraus einen mehrzeiligen Wert, den das Dateikommando ablehnt.
          # Meldungen gehen deshalb nach stderr; im Log stehen sie genauso.
          #
          # Nur das App-Paar: Signaturschluessel und R2-Zugang liegen im
          # Archiv-Repository, nicht hier. Kein gespeichertes PAT.
          apt_names=(ARCHIVE_DISPATCH_CLIENT_ID ARCHIVE_DISPATCH_PRIVATE_KEY)
          aur_names=(AUR_SSH_PRIVATE_KEY AUR_SSH_KNOWN_HOSTS)

          decide() {
            local channel=$1; shift
            local present=0 missing=0 name
            for name in "$@"; do
              if [[ -n "${!name:-}" ]]; then present=$((present + 1)); else missing=$((missing + 1)); fi
            done
            if (( present == 0 )); then
              echo "::notice::$channel is not configured and will be skipped" >&2
              printf 'false'
            elif (( missing > 0 )); then
              echo "::error::UG7020 $channel is only partly configured; $missing value(s) missing" >&2
              return 1
            else
              printf 'true'
            fi
          }

          # Zuweisung und Aufruf muessen getrennt stehen. In der Form
          # echo "apt=$(decide ...)" bleibt ein Fehlschlag von decide folgenlos,
          # weil der Exit-Status der von echo ist; ein nur halb konfigurierter
          # Kanal liefe dann trotz UG7020 weiter.
          apt=$(decide APT "${apt_names[@]}")
          aur=$(decide AUR "${aur_names[@]}")
          echo "apt=$apt" >> "$GITHUB_OUTPUT"
          echo "aur=$aur" >> "$GITHUB_OUTPUT"
      - name: Gibt es das Crate auf crates.io schon?
        id: crates
        run: |
          set -euo pipefail
          # Trusted Publishing setzt ein bestehendes Crate voraus; die erste
          # Version wird einmalig von Hand veroeffentlicht. Solange sie fehlt,
          # ist der Kanal nicht konfiguriert und wird uebersprungen.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -H 'User-Agent: ugos-cli release pipeline' \
            'https://crates.io/api/v1/crates/ugos-client')
          case "$code" in
            200) echo "crates=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "::notice::ugos-client gibt es auf crates.io noch nicht; der Kanal wird uebersprungen"
                 echo "crates=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "::error::UG7030 crates.io antwortet mit HTTP $code"; exit 1 ;;
          esac
      # Kein /api/v1/me als Vorpruefung: das antwortet auch mit gueltigem
      # Token 403. Geprueft wird der spaetere Weg selbst, indem ein
      # kurzlebiges Token ausgestellt und verworfen wird.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: steps.crates.outputs.crates == 'true'

  build:
    name: Build (${{ matrix.target }})
    needs: [metadata]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
      # Kein dtolnay/rust-toolchain: die Version steht in rust-toolchain.toml
      # und rustup installiert sie daraus, genau wie in der CI. Die Aktion
      # haengt den Zieltriple sonst an die aktuelle stable, waehrend cargo im
      # Repo die festgelegte Toolchain benutzt. Beim Cross-Build fehlt dort
      # dann die Standardbibliothek, und rustc bricht mit E0463 ab.
      - run: rustup show
      - name: Zieltriple zur festgelegten Toolchain hinzufuegen
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} -p ugos-cli -p ugos-mcp
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          tar czf ../../../ugos-cli-${{ matrix.target }}.tar.gz ugos-cli ugos-mcp
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          7z a ../../../ugos-cli-${{ matrix.target }}.zip ugos-cli.exe ugos-mcp.exe
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ugos-cli-${{ matrix.target }}
          path: |
            ugos-cli-${{ matrix.target }}.tar.gz
            ugos-cli-${{ matrix.target }}.zip

  package-deb:
    name: Debian package (${{ matrix.arch }})
    needs: [metadata, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ugos-cli-${{ matrix.target }}
          path: ./archives
      - name: Build the package from the released archive
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          scripts/release/build-deb.sh \
            --archive "./archives/ugos-cli-${{ matrix.target }}.tar.gz" \
            --arch "${{ matrix.arch }}" \
            --version "$VERSION" \
            --output-dir ./debs \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
      - name: Verify the package installs and runs
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          deb="./debs/ugos-cli_${VERSION}_${{ matrix.arch }}.deb"
          dpkg-deb --contents "$deb"
          # Only the native architecture can actually be installed here.
          if [[ "${{ matrix.arch }}" == amd64 ]]; then
            sudo dpkg -i "$deb"
            installed=$(ugos-cli --version)
            [[ "$installed" == "ugos ${VERSION}" ]] || {
              echo "::error::UG7310 installed binary reports '$installed'"; exit 1; }
            # ugos-mcp speaks MCP on stdio and has no --version to ask, so
            # only its presence and mode are checked here.
            [[ -x /usr/bin/ugos-mcp ]] || {
              echo "::error::UG7311 ugos-mcp is missing or not executable"; exit 1; }
            sudo dpkg -r ugos-cli
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ugos-cli-deb-${{ matrix.arch }}
          path: ./debs/*.deb

  # Stufe 7. Gestufte Vorabveroeffentlichung. Die Assets haengen am Entwurf,
  # werden von dort zurueckgelesen und geprueft, und erst dann wird das
  # Release sichtbar, aber ohne `latest`. Sichtbar muss es vor den Kanaelen
  # sein: Homebrew und AUR laden in ihrem eigenen Test von der Release-URL,
  # und die Assets eines Entwurfs antworten unauthentifiziert mit 404. Als
  # Prerelease installiert es dennoch niemand automatisch.
  # Stufe 3. Signieren und attestieren. Cosign keyless ueber die
  # OIDC-Identitaet des Laufs, dazu je Payload eine SPDX-SBOM. Die SBOMs
  # bekommen kein eigenes Bundle; sie sind von SHA256SUMS und der
  # Attestierung mitgedeckt.
  sign:
    name: Payloads signieren und attestieren
    needs: [metadata, build, package-deb]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ./incoming
      - name: Payloads flach zusammenziehen
        run: |
          set -euo pipefail
          mkdir -p ./payload
          find ./incoming -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' \) \
            -exec cp -f {} ./payload/ ';'
          count=$(find ./payload -type f | wc -l | tr -d ' ')
          # Sechs Archive plus zwei .deb. Die Zahl steht hier einmal und
          # nirgends sonst; die Stufen danach leiten ihre Erwartung daraus ab.
          if [[ "$count" != 8 ]]; then
            echo "::error::UG7200 erwartet werden 8 Payloads, gefunden sind $count"
            ls -1 ./payload
            exit 1
          fi
          ls -1 ./payload
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: SBOM und Signaturbundle je Payload
        run: |
          set -euo pipefail
          for payload in ./payload/*; do
            name=$(basename "$payload")
            # Der volle Name bleibt stehen, auch wenn er schon .tar.gz oder
            # .deb enthaelt: sonst kollidieren Archiv und Paket derselben
            # Architektur in einer Datei.
            syft scan "file:${payload}" -o "spdx-json=./payload/${name}.spdx.json" -q
            cosign sign-blob --yes \
              --bundle "./payload/${name}.sigstore.json" "$payload"
            echo "  signiert $name"
          done
      - name: Attestierung fuer jeden Payload
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ./payload/*.tar.gz
            ./payload/*.zip
            ./payload/*.deb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-payloads
          path: ./payload/*
          if-no-files-found: error

  # Stufe 4. Vollstaendigkeit erzwingen. Zwischenschritt, nicht die
  # Endabnahme: je Payload muessen Payload, SBOM und Bundle vorliegen, und
  # jede Signatur und Attestierung muss halten.
  aggregate:
    name: Payload-Vollstaendigkeit
    needs: [metadata, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-payloads
          path: ./payload
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Zaehlen, Signaturen und Attestierungen pruefen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          payloads=()
          while IFS= read -r file; do payloads+=("$file"); done < <(
            find ./payload -maxdepth 1 -type f \
              \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' \) | sort)
          if (( ${#payloads[@]} != 8 )); then
            echo "::error::UG7201 erwartet werden 8 Payloads, gefunden sind ${#payloads[@]}"
            exit 1
          fi
          total=$(find ./payload -maxdepth 1 -type f | wc -l | tr -d ' ')
          if (( total != 24 )); then
            echo "::error::UG7202 erwartet werden 24 Dateien, also je Payload Payload, SBOM und Bundle; gefunden sind $total"
            ls -1 ./payload
            exit 1
          fi
          for payload in "${payloads[@]}"; do
            name=$(basename "$payload")
            [[ -f "./payload/${name}.spdx.json" ]] || {
              echo "::error::UG7203 SBOM fehlt zu $name"; exit 1; }
            [[ -f "./payload/${name}.sigstore.json" ]] || {
              echo "::error::UG7204 Signaturbundle fehlt zu $name"; exit 1; }
            # Die Identitaet wird als Muster geprueft. Bei einem
            # wiederverwendbaren Workflow ist die Ref im Zertifikat die des
            # Aufrufers, nicht die des Tags; gebunden bleibt sie an dieses
            # Repository und diese Workflow-Datei.
            cosign verify-blob \
              --bundle "./payload/${name}.sigstore.json" \
              --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$payload"
            gh attestation verify "$payload" --repo "$GITHUB_REPOSITORY" \
              --deny-self-hosted-runners
            echo "  ok $name"
          done
          echo "::notice::8 Payloads mit SBOM, Signatur und Attestierung geprueft"

  # Stufe 5a. Kanal-Metadaten aus den qualifizierten Payloads erzeugen und
  # gleich qualifizieren: die Arch-Paketierung baut hier und wird gegen das
  # Release-Archiv geprueft, bevor irgendetwas veroeffentlicht wird. Signiert
  # und attestiert werden die Metadaten wie ein Payload, eine eigene SBOM
  # brauchen sie nicht.
  channel-metadata:
    name: Kanal-Metadaten erzeugen und qualifizieren
    needs: [metadata, sign, aggregate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-payloads
          path: ./payload
      - name: Homebrew-Formel schreiben
        run: |
          set -euo pipefail

          checksum() {
            local target=$1
            local path="./payload/ugos-cli-${target}.tar.gz"
            if [[ ! -f "$path" ]]; then
              echo "::error::UG7500 release archive is missing: $path" >&2
              exit 1
            fi
            sha256sum "$path" | cut -d' ' -f1
          }

          # Jede Download-URL wird aus dem vollstaendigen Tag gebaut, nicht
          # aus v$VERSION. Bei einem Vorabtag sind das zwei verschiedene
          # Dinge, und die Datei liegt unter dem Tag.
          MAC_X64_SHA=$(checksum x86_64-apple-darwin)
          MAC_ARM64_SHA=$(checksum aarch64-apple-darwin)
          LINUX_X64_SHA=$(checksum x86_64-unknown-linux-gnu)
          LINUX_ARM64_SHA=$(checksum aarch64-unknown-linux-gnu)

          cat > formula.rb <<RUBY
          class UgosCli < Formula
            desc "CLI and MCP server for UGREEN NAS (UGOS) management"
            homepage "https://github.com/metaneutrons/ugos-cli"
            license "GPL-3.0-or-later"

            on_macos do
              if Hardware::CPU.intel?
                url "https://github.com/metaneutrons/ugos-cli/releases/download/${TAG}/ugos-cli-x86_64-apple-darwin.tar.gz"
                sha256 "${MAC_X64_SHA}"
              else
                url "https://github.com/metaneutrons/ugos-cli/releases/download/${TAG}/ugos-cli-aarch64-apple-darwin.tar.gz"
                sha256 "${MAC_ARM64_SHA}"
              end
            end

            on_linux do
              if Hardware::CPU.intel?
                url "https://github.com/metaneutrons/ugos-cli/releases/download/${TAG}/ugos-cli-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${LINUX_X64_SHA}"
              else
                url "https://github.com/metaneutrons/ugos-cli/releases/download/${TAG}/ugos-cli-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${LINUX_ARM64_SHA}"
              end
            end

            def install
              bin.install "ugos-cli"
              bin.install "ugos-mcp"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/ugos-cli --version")
            end
          end
          RUBY

          ruby -c formula.rb
          if [[ $(grep -Fc "/releases/download/${TAG}/" formula.rb) != 4 ]]; then
            echo "::error::UG7501 formula does not reference four exact release URLs"
            exit 1
          fi
          mkdir -p ./meta
          install -m 0644 formula.rb ./meta/ugos-cli.rb
      - name: PKGBUILD und .SRCINFO schreiben
        run: |
          set -euo pipefail
          x86=$(sha256sum ./payload/ugos-cli-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          arm=$(sha256sum ./payload/ugos-cli-aarch64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          cat > PKGBUILD <<PKG
          # Maintainer: Fabian Schmieder <fabian@schmieder.eu>
          pkgname=ugos-cli-bin
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="CLI and MCP server for UGREEN NAS (UGOS) management"
          arch=('x86_64' 'aarch64')
          url="https://github.com/metaneutrons/ugos-cli"
          license=('GPL-3.0-or-later')
          provides=('ugos-cli')
          conflicts=('ugos-cli')
          source_x86_64=("\${pkgname}-\${pkgver}-x86_64.tar.gz::${base}/ugos-cli-x86_64-unknown-linux-gnu.tar.gz")
          source_aarch64=("\${pkgname}-\${pkgver}-aarch64.tar.gz::${base}/ugos-cli-aarch64-unknown-linux-gnu.tar.gz")
          sha256sums_x86_64=('${x86}')
          sha256sums_aarch64=('${arm}')

          package() {
            install -Dm755 "\${srcdir}/ugos-cli" "\${pkgdir}/usr/bin/ugos-cli"
            install -Dm755 "\${srcdir}/ugos-mcp" "\${pkgdir}/usr/bin/ugos-mcp"
          }
          PKG
          cat PKGBUILD
          # Nur --printsrcinfo, kein Bau. makepkg wuerde die Quellen von der
          # Release-URL holen, und das Release entsteht erst in Stufe 7. Der
          # Bau samt Vergleich gegen das Archiv steht deshalb im AUR-Job,
          # vor dem Push und nach der Veroeffentlichung.
          #
          # Gemountet wird ein eigenes Verzeichnis, nicht das Arbeitsverzeichnis:
          # makepkg laeuft nicht als root, und das dafuer noetige
          # `chown -R builder` wuerde sonst alles daneben auf eine fremde UID
          # ziehen. Danach wird die Eigentuemerschaft zurueckgeholt.
          mkdir -p ./aurwork
          install -m 0644 PKGBUILD ./aurwork/PKGBUILD
          docker run --rm --user root \
            --volume "$PWD/aurwork:/pkg" --workdir /pkg \
            archlinux:base-devel@sha256:a26046b7363dad8e2614858f4313949ae9b05c9c5f31de343a54864b9e20806f \
            bash -euo pipefail -c '
              useradd -m builder
              chown -R builder:builder /pkg
              su builder -c "makepkg --printsrcinfo > .SRCINFO"
            '
          sudo chown -R "$(id -u):$(id -g)" ./aurwork
          [[ -s ./aurwork/.SRCINFO ]] || { echo "::error::UG7603 .SRCINFO ist leer"; exit 1; }
          install -m 0644 PKGBUILD ./meta/PKGBUILD
          # Als ugos-cli.SRCINFO, nicht als .SRCINFO: GitHub benennt ein
          # Release-Asset mit fuehrendem Punkt in default.SRCINFO um. Der
          # AUR-Job legt den Punkt vor dem Push wieder davor; signiert und
          # attestiert wird der Inhalt, nicht der Name.
          install -m 0644 ./aurwork/.SRCINFO ./meta/ugos-cli.SRCINFO
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Metadaten signieren
        run: |
          set -euo pipefail
          for file in ./meta/ugos-cli.rb ./meta/PKGBUILD ./meta/ugos-cli.SRCINFO; do
            name=$(basename "$file")
            cosign sign-blob --yes --bundle "./meta/${name}.sigstore.json" "$file"
            echo "  signiert $name"
          done
      - name: Metadaten attestieren
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ./meta/ugos-cli.rb
            ./meta/PKGBUILD
            ./meta/ugos-cli.SRCINFO
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: channel-metadata
          path: ./meta/*
          include-hidden-files: true
          if-no-files-found: error

  # Stufe 5b. Endabnahme. Die erwartete Liste entsteht aus den Payloads und
  # den tatsaechlich erzeugten Kanal-Metadaten, nicht aus einer zweiten
  # Konstante. Erst danach entsteht SHA256SUMS, und dessen Zeilenmenge deckt
  # sich genau mit dieser Liste. Nach diesem Job darf keine Stufe mehr ein
  # Asset hinzufuegen oder aendern.
  candidate:
    name: Endgueltige Release-Liste
    needs: [metadata, sign, aggregate, channel-metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-payloads
          path: ./release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: channel-metadata
          path: ./release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Liste bilden, alles pruefen, dann SHA256SUMS schreiben
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd ./release

          signed=()
          while IFS= read -r file; do signed+=("${file#./}"); done < <(
            find . -maxdepth 1 -type f \
              \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' \
                 -o -name 'ugos-cli.rb' -o -name 'PKGBUILD' -o -name 'ugos-cli.SRCINFO' \) | sort)
          # Acht Payloads plus drei Metadatendateien.
          if (( ${#signed[@]} != 11 )); then
            echo "::error::UG7210 erwartet werden 11 signierte Dateien, gefunden sind ${#signed[@]}"
            ls -1a
            exit 1
          fi

          expected=()
          for file in "${signed[@]}"; do
            expected+=("$file" "${file}.sigstore.json")
            case "$file" in
              *.tar.gz|*.zip|*.deb) expected+=("${file}.spdx.json") ;;
            esac
            [[ -f "${file}.sigstore.json" ]] || {
              echo "::error::UG7211 Signaturbundle fehlt zu $file"; exit 1; }
            cosign verify-blob \
              --bundle "${file}.sigstore.json" \
              --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$file"
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --deny-self-hosted-runners
            echo "  ok $file"
          done

          # Vorhandene Dateien gegen die erwartete Liste, in beide Richtungen.
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          find . -maxdepth 1 -type f | sed 's|^\./||' | sort > /tmp/present
          if ! diff -u /tmp/expected /tmp/present; then
            echo "::error::UG7212 die Kandidatenliste weicht vom Verzeichnis ab"
            exit 1
          fi

          sha256sum "${expected[@]}" > SHA256SUMS
          lines=$(wc -l < SHA256SUMS | tr -d ' ')
          if (( lines != ${#expected[@]} )); then
            echo "::error::UG7213 SHA256SUMS hat $lines Zeilen, erwartet sind ${#expected[@]}"
            exit 1
          fi
          sha256sum --check --quiet SHA256SUMS
          echo "::notice::${#expected[@]} Assets plus SHA256SUMS abgenommen"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: ./release/*
          include-hidden-files: true
          if-no-files-found: error

  stage:
    name: Vorabveroeffentlichung
    needs: [metadata, channel-preflight, candidate]
    if: >-
      !cancelled()
      && needs.metadata.result == 'success'
      && needs.candidate.result == 'success'
      && (
        (needs.metadata.outputs.is_prerelease == 'true'
          && needs.channel-preflight.result == 'skipped')
        || (needs.metadata.outputs.is_prerelease == 'false'
          && needs.channel-preflight.result == 'success')
      )
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: ./candidate
      - name: Entwurf anlegen, falls keiner da ist
        run: |
          set -euo pipefail
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo absent)
          case "$state" in
            absent) gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --notes "Pipeline-Testlauf." ;;
            true)   echo "::notice::Entwurf von release-please wird bestueckt" ;;
            false)  echo "::error::UG7004 release $TAG is already published"; exit 1 ;;
          esac
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          files: candidate/*
      - name: Die Bytes vom Entwurf zurueckholen und gegen die Kandidaten pruefen
        run: |
          set -euo pipefail
          # Ein erfolgreicher Upload ist keine Aussage darueber, was am Release
          # liegt. Geprueft wird, was von dort zurueckkommt.
          #
          # candidate liegt bereits flach; es ist genau die in Stufe 5b
          # abgenommene Liste.
          mkdir -p ./flat ./staged
          find ./candidate -maxdepth 1 -type f -exec cp -f {} ./flat/ ';'
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir ./staged --clobber

          status=0
          for path in ./flat/*; do
            name=$(basename "$path")
            if [[ ! -f "./staged/$name" ]]; then
              echo "::error::UG7100 $name fehlt am Release"
              status=1
              continue
            fi
            cmp "$path" "./staged/$name"
            echo "  ok $name"
          done
          (( status == 0 )) || exit 1

          # Das Release darf auch nichts Zusaetzliches tragen: eine Datei, die
          # kein Kandidat ist, waere aus einem frueheren Lauf uebrig.
          for path in ./staged/*; do
            name=$(basename "$path")
            [[ -f "./flat/$name" ]] || {
              echo "::error::UG7101 das Release traegt ein fremdes Asset: $name"
              status=1; }
          done
          (( status == 0 )) || exit 1

          # Die Pruefsummendatei gilt gegen die Bytes vom Release, nicht gegen
          # die lokalen Kandidaten: sonst prueft sie sich selbst.
          ( cd ./staged && sha256sum --check --quiet SHA256SUMS )
          echo "::notice::$(find ./flat -type f | wc -l | tr -d ' ') Assets geprueft, SHA256SUMS gegen das Release bestaetigt"
      - name: Als Vorabversion sichtbar machen, ohne latest
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease --latest=false
          read -r draft pre < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')
          [[ "$draft" == false && "$pre" == true ]] || {
            echo "::error::UG7102 $TAG ist nicht als Vorabversion sichtbar (draft=$draft prerelease=$pre)"
            exit 1; }
          # `latest` ist kein Feld des Releases, sondern eine Auswahl des
          # Repositories. Gefragt wird deshalb, was das Repository ausliefert.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || echo none)
          [[ "$latest" != "$TAG" ]] || {
            echo "::error::UG7103 $TAG steht bereits auf latest, obwohl noch kein Kanal lief"
            exit 1; }
          echo "::notice::$TAG ist sichtbar als Vorabversion, latest steht auf $latest"


  publish-apt:
    name: Ask the archive to publish
    needs: [metadata, channel-preflight, stage]
    if: needs.channel-preflight.outputs.publish_apt == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      ARCHIVE_REPO: metaneutrons/apt-archive
      ARCHIVE_DOMAIN: metaneutrons.cc
      ARCHIVE_PROJECT: ugos-cli
      DEB_PACKAGE: ugos-cli
    steps:
      # Dieses Repository laedt nichts hoch und haelt keinen Signaturschluessel.
      # Ein R2-Token laesst sich auf einen Bucket begrenzen, nicht auf ein
      # Praefix; ein Schreibzugang je Projekt waere ein Schreibzugang auf das
      # ganze Archiv. Die .deb haengen attestiert am Release, und das Archiv
      # holt sie sich von dort.
      #
      # Das Token wird unmittelbar vor der Benutzung gepraegt, auf genau ein
      # Repository und genau zwei Rechte, und faellt am Jobende weg. Ein
      # gespeichertes PAT waere ein langlebiger Generalschluessel.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: archive-token
        with:
          client-id: ${{ vars.ARCHIVE_DISPATCH_CLIENT_ID }}
          private-key: ${{ secrets.ARCHIVE_DISPATCH_PRIVATE_KEY }}
          owner: metaneutrons
          repositories: apt-archive
          permission-actions: write
          permission-contents: read

      # Der Vertrag wird gelesen, nicht angenommen. Ob das Archiv je Projekt
      # ein Praefix fuehrt oder alles an der Domain-Wurzel liegt, entscheidet
      # das Manifest; eine hier festgeschriebene URL waere beim naechsten
      # Umbau des Archivs still falsch.
      - name: Den Domain-Vertrag aus dem Manifest lesen
        id: contract
        env:
          GH_TOKEN: ${{ steps.archive-token.outputs.token }}
        run: |
          set -euo pipefail
          gh api "repos/${ARCHIVE_REPO}/contents/domains/${ARCHIVE_DOMAIN}/manifest.toml" \
            --jq .content | base64 -d > manifest.toml
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, sys, tomllib
          # Alle Umgebungswerte zuerst, damit kein Fehlerpfad selbst noch
          # etwas nachschlagen muss und statt der Meldung eine Ausnahme wirft.
          project = os.environ["ARCHIVE_PROJECT"]
          package = os.environ["DEB_PACKAGE"]
          domain = os.environ.get("ARCHIVE_DOMAIN", "der Domain")
          with open("manifest.toml", "rb") as fh:
              m = tomllib.load(fh)
          entry = next((p for p in m.get("projects", []) if p.get("name") == project), None)
          if entry is None:
              sys.exit(f"::error::UG7440 {project} steht nicht im Manifest von {domain}")
          if package not in entry.get("packages", []):
              sys.exit(f"::error::UG7441 {package} steht nicht unter packages von {project}")
          rel, dom = m["release"], m["domain"]
          if "main" not in rel.get("components", []):
              sys.exit("::error::UG7442 die Komponente main fehlt im Manifest")
          for arch in ("amd64", "arm64"):
              if arch not in rel.get("architectures", []):
                  sys.exit(f"::error::UG7443 die Architektur {arch} fehlt im Manifest")
          # Unified: ein gemeinsames Archiv an der Domain-Wurzel, pool/ und
          # dists/ fuer alle Projekte zusammen. Ein Projekt-Praefix waere ein
          # anderes Layout, und dann zeigte jede hier gebaute URL ins Leere.
          prefix = (entry.get("prefix") or "").strip("/")
          if prefix:
              sys.exit(f"::error::UG7444 das Manifest fuehrt fuer {project} das Praefix /{prefix}; erwartet wird ein gemeinsames Archiv an der Domain-Wurzel")
          print(f"base_url={dom['base_url'].rstrip('/')}")
          print(f"suite={rel['codename']}")
          PY
          echo "::notice::Vertrag: $(grep base_url "$GITHUB_OUTPUT" | tail -1), $(grep suite= "$GITHUB_OUTPUT" | tail -1)"

      # Der gepruefte Workflow auf dem geschuetzten Default-Branch, mit
      # benannten Eingaben. Ein repository_dispatch waere ein blindes Ereignis
      # ohne Angabe, welcher Workflow auf welcher Ref laufen soll.
      - name: Den Archiv-Workflow anstossen
        id: dispatch
        env:
          GH_TOKEN: ${{ steps.archive-token.outputs.token }}
        run: |
          set -euo pipefail
          branch=$(gh api "repos/${ARCHIVE_REPO}" --jq .default_branch)
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "since=$since" >> "$GITHUB_OUTPUT"
          gh workflow run publish.yml --repo "$ARCHIVE_REPO" --ref "$branch" \
            -f domain="$ARCHIVE_DOMAIN" -f project="$ARCHIVE_PROJECT"
          echo "::notice::publish.yml auf ${ARCHIVE_REPO}@${branch} angestossen"

      # Nur zur Zuordnung im Log. Der Lauf wird nach seiner Startzeit gesucht,
      # nicht als "der neueste": bei zwei Anstoessen kurz hintereinander waere
      # das der falsche. Findet sich keiner eindeutig, ist das kein Fehler,
      # denn der Beweis steht weiter unten am oeffentlichen Archiv.
      - name: Den angestossenen Lauf zuordnen
        continue-on-error: false
        env:
          GH_TOKEN: ${{ steps.archive-token.outputs.token }}
          SINCE: ${{ steps.dispatch.outputs.since }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 10); do
            ids=$(gh run list --repo "$ARCHIVE_REPO" --workflow publish.yml \
              --event workflow_dispatch --limit 20 \
              --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"$SINCE\") | .databaseId] | @tsv")
            count=$(printf '%s' "$ids" | wc -w | tr -d ' ')
            if [[ "$count" == 1 ]]; then
              echo "::notice::Lauf ${ids} im Archiv"
              break
            fi
            if [[ "$count" -gt 1 ]]; then
              echo "::notice::mehrere Laeufe seit $SINCE, keine eindeutige Zuordnung; geprueft wird das Archiv"
              break
            fi
            sleep 6
          done

      # Der eigentliche Beweis. Weder die Annahme des Anstosses noch ein gruener
      # Job sagt etwas darueber, was das Archiv ausliefert.
      - name: Warten, bis das Archiv die Version ausliefert
        env:
          BASE_URL: ${{ steps.contract.outputs.base_url }}
          SUITE: ${{ steps.contract.outputs.suite }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pick.awk" <<'AWK'
          BEGIN { prefix = version "-" }
          $1 == "Package:"  { pkg  = $2 }
          $1 == "Version:"  { ver  = $2 }
          $1 == "Filename:" { name = $2 }
          function hit() { return pkg == package && substr(ver, 1, length(prefix)) == prefix }
          # awk fuehrt END auch nach exit aus, deshalb die Marke.
          /^[[:space:]]*$/ { if (hit()) { print name; done = 1; exit } pkg = ""; ver = ""; name = "" }
          END { if (!done && hit()) print name }
          AWK

          # Der Index ist gemeinsam: er traegt auch die Stanzas anderer
          # Projekte. Gesucht wird strikt das eigene Paket, verglichen wird der
          # Upstream-Teil als Zeichenkette, nicht als regulaerer Ausdruck.
          # Der Debian-Versionsstring traegt eine Revision, build-deb.sh setzt
          # `${version}-1`.
          #
          # Ohne Cache-Buster: die Cache Rule der Zone setzt fuer dists/**
          # `Cache-Control: no-store`, gerade damit ein alter Index nicht gegen
          # ein neues InRelease laufen kann.
          index="${BASE_URL}/dists/${SUITE}/main/binary-amd64/Packages.gz"
          deadline=$(( SECONDS + 1500 ))
          while :; do
            if curl --fail --silent --show-error --location "$index" --output packages.gz 2>/dev/null; then
              found=$(gzip -dc packages.gz \
                | awk -v package="$DEB_PACKAGE" -v version="$VERSION" -f "$RUNNER_TEMP/pick.awk")
              if [[ -n "$found" ]]; then
                echo "::notice::${BASE_URL} liefert ${VERSION} als ${found}"
                break
              fi
            fi
            if (( SECONDS > deadline )); then
              echo "::error::UG7430 das Archiv liefert ${VERSION} nicht innerhalb der Frist; der Anstoss ging raus, die Ursache steht in den Laeufen von ${ARCHIVE_REPO}"
              exit 1
            fi
            sleep 30
          done

      # Ein Index, der die Version nennt, ist noch keine ausgelieferte Datei.
      - name: Das ausgelieferte Paket gegen das Release vergleichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          BASE_URL: ${{ steps.contract.outputs.base_url }}
          SUITE: ${{ steps.contract.outputs.suite }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            curl --fail --silent --show-error --location \
              "${BASE_URL}/dists/${SUITE}/main/binary-${arch}/Packages.gz" \
              --output "packages-${arch}.gz"
            filename=$(gzip -dc "packages-${arch}.gz" \
              | awk -v package="$DEB_PACKAGE" -v version="$VERSION" -f "$RUNNER_TEMP/pick.awk")
            if [[ -z "$filename" ]]; then
              echo "::error::UG7431 der Index fuer ${arch} nennt keine Datei zu ${VERSION}"
              exit 1
            fi
            curl --fail --silent --show-error --location \
              "${BASE_URL}/${filename}" --output "published-${arch}.deb"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "ugos-cli_${VERSION}_${arch}.deb" --dir ./release --clobber
            cmp "published-${arch}.deb" "./release/ugos-cli_${VERSION}_${arch}.deb"
            echo "::notice::${arch} identisch mit dem Release-Asset"
          done

  update-homebrew:
    name: Update Homebrew Tap
    needs: [metadata, channel-preflight, stage]
    runs-on: ubuntu-latest
    environment: release
    # Die Qualifikation im Tap fuehrt brew audit, install und test auf zwei
    # macOS-Runnern aus. Der Job wartet darauf, gebunden, und praegt danach
    # ein frisches Token.
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      TAP_REPO: metaneutrons/homebrew-tap
      VERSION: ${{ needs.metadata.outputs.version }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: tap-token
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: metaneutrons
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
          permission-checks: read
          permission-statuses: read
          permission-administration: read

      - name: Installation und Bot messen
        id: identity
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          set -euo pipefail
          reached=$(gh api installation/repositories --jq '[.repositories[].full_name] | sort | join(",")')
          if [[ "$reached" != "$TAP_REPO" ]]; then
            echo "::error::UG7510 die Installation erreicht '$reached' statt genau $TAP_REPO"
            exit 1
          fi
          # Die Git-Autorschaft kommt aus der gemessenen Bot-Identitaet, nicht
          # aus einem geratenen Namen. `/user` gilt fuer ein
          # Installations-Token nicht, deshalb der oeffentliche Endpunkt.
          read -r login id < <(gh api "users/metaneutrons-homebrew%5Bbot%5D" --jq '"\(.login) \(.id)"')
          {
            echo "bot_login=$login"
            echo "bot_email=${id}+${login}@users.noreply.github.com"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Installation $reached, Bot $login"

      - name: Die Formel vom Release holen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Das Repository-Token gilt nur dem eigenen Release, nie dem Tap.
          # Die Formel wurde in Stufe 5 erzeugt, qualifiziert, signiert und
          # attestiert; hier wird sie nicht noch einmal gebaut.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'ugos-cli.rb' --dir . --clobber
          mv ugos-cli.rb formula.rb
          if [[ $(grep -Fc "/releases/download/${TAG}/" formula.rb) != 4 ]]; then
            echo "::error::UG7506 the formula fetched from the release does not reference four exact release URLs"
            exit 1
          fi

      - name: Zweig, Commit und Pull Request im Tap
        id: pr
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
          BOT_LOGIN: ${{ steps.identity.outputs.bot_login }}
          BOT_EMAIL: ${{ steps.identity.outputs.bot_email }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          install -d tap/Formula
          install -m 0644 formula.rb tap/Formula/ugos-cli.rb
          cd tap
          # Die Qualifikation im Tap prueft auch, dass README.md aus den
          # Formeln erzeugt wurde. Ohne diesen Lauf scheitert der Pull Request
          # an dieser Pruefung statt an der Formel.
          scripts/generate-readme.sh README.md
          if [[ -z $(git status --porcelain) ]]; then
            echo "::notice::the tap already carries this formula"
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "unchanged=false" >> "$GITHUB_OUTPUT"

          # main des Taps ist geschuetzt: Pull Request und der Check
          # "Formula qualification" sind Pflicht, ein Direkt-Push wird
          # abgewiesen. Reviews verlangt der Tap keine.
          branch="ugos-cli-${VERSION}"
          git config user.name "$BOT_LOGIN"
          git config user.email "$BOT_EMAIL"
          git checkout -b "$branch"
          git add Formula/ugos-cli.rb README.md
          git commit -m "Update ugos-cli to ${VERSION}"
          git push --force-with-lease origin "$branch"
          head=$(git rev-parse HEAD)

          pr=$(gh pr list --repo "$TAP_REPO" --head "$branch" --state open \
                 --json number --jq '.[0].number // empty')
          if [[ -z "$pr" ]]; then
            url=$(gh pr create --repo "$TAP_REPO" --base main --head "$branch" \
                    --title "Update ugos-cli to ${VERSION}" \
                    --body "Formel-Bump aus dem Release-Lauf von ugos-cli ${TAG}.")
            pr=${url##*/}
          fi
          if [[ ! "$pr" =~ ^[0-9]+$ ]]; then
            echo "::error::UG7502 no pull request number for $branch"
            exit 1
          fi
          {
            echo "number=$pr"
            echo "head=$head"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::tap pull request #$pr auf $head"

      # Gebunden auf 45 Minuten, damit die Wartezeit innerhalb der Lebensdauer
      # des ersten Tokens bleibt. Ein Zeitueberlauf scheitert geschlossen: er
      # rechtfertigt weder einen Merge noch einen zweiten Versuch mit einer
      # breiteren Berechtigung.
      - name: Auf die Qualifikation warten
        if: steps.pr.outputs.unchanged == 'false'
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            n=$(gh pr checks "$PR" --repo "$TAP_REPO" --json name --jq 'length' 2>/dev/null || echo 0)
            [[ "${n:-0}" -gt 0 ]] && break
            sleep 10
          done
          set +e
          timeout 2700 gh pr checks "$PR" --repo "$TAP_REPO" --watch --fail-fast --interval 30
          rc=$?
          set -e
          case "$rc" in
            0)   echo "::notice::Qualifikation bestanden" ;;
            124) echo "::error::UG7504 die Qualifikation war nach 45 Minuten nicht fertig"; exit 1 ;;
            *)   echo "::error::UG7503 die Qualifikation endete mit Exit $rc"; exit 1 ;;
          esac

      # Nach der Wartezeit ein frisches Token. Das erste ist womoeglich schon
      # abgelaufen, und ein Merge ist der letzte und teuerste Schreibzugriff.
      # Gepraegt wird es auch dann, wenn nichts zu mergen war: so hat das
      # Ruecklesen genau eine Herkunft statt eines Fallback-Ausdrucks, den
      # weder ein Leser noch ein Pruefer aufloesen kann.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: merge-token
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: metaneutrons
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
          permission-checks: read
          permission-statuses: read
          permission-administration: read

      - name: Kopf, Pflichtchecks und Tap-Schutz erneut pruefen, dann mergen
        if: steps.pr.outputs.unchanged == 'false'
        env:
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
          EXPECTED_HEAD: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          reached=$(gh api installation/repositories --jq '[.repositories[].full_name] | sort | join(",")')
          [[ "$reached" == "$TAP_REPO" ]] || {
            echo "::error::UG7510 das zweite Token erreicht '$reached'"; exit 1; }

          head=$(gh pr view "$PR" --repo "$TAP_REPO" --json headRefOid --jq .headRefOid)
          if [[ "$head" != "$EXPECTED_HEAD" ]]; then
            echo "::error::UG7511 der Kopf der Pull Request ist $head, gepusht wurde $EXPECTED_HEAD"
            exit 1
          fi

          # Der Schutz gilt weiterhin, und der Gate-Check ist weiterhin
          # Pflicht. Sonst waere die Qualifikation nur noch Dekoration.
          contexts=$(gh api "repos/${TAP_REPO}/branches/main/protection" \
            --jq '[.required_status_checks.contexts[]] | join(",")')
          if [[ ",$contexts," != *",Formula qualification,"* ]]; then
            echo "::error::UG7512 'Formula qualification' ist auf $TAP_REPO nicht mehr Pflicht (jetzt: $contexts)"
            exit 1
          fi

          state=$(gh pr view "$PR" --repo "$TAP_REPO" --json statusCheckRollup \
            --jq '[.statusCheckRollup[] | select(.name == "Formula qualification")] | last
                  | if . == null then "absent none"
                    else "\((.status // "absent") | ascii_downcase) \((.conclusion // "none") | ascii_downcase)" end')
          if [[ "$state" != "completed success" ]]; then
            echo "::error::UG7513 'Formula qualification' steht auf '$state' statt auf completed success"
            exit 1
          fi

          gh pr merge "$PR" --repo "$TAP_REPO" --squash --delete-branch

      - name: Die Formel auf main zuruecklesen
        env:
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
        run: |
          set -euo pipefail
          gh api "repos/${TAP_REPO}/contents/Formula/ugos-cli.rb?ref=main" \
            --jq .content | base64 --decode > published.rb
          # Byteweise gegen das erzeugte Asset, nicht nur auf die Version
          # geprueft: eine Formel kann die richtige Version nennen und trotzdem
          # eine andere sein.
          cmp published.rb formula.rb
          echo "::notice::die Formel auf $TAP_REPO ist byteweise die erzeugte"

  publish-aur:
    name: Publish AUR package
    needs: [metadata, channel-preflight, stage]
    if: needs.channel-preflight.outputs.publish_aur == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      AUR_SSH_KNOWN_HOSTS: ${{ vars.AUR_SSH_KNOWN_HOSTS }}
    steps:
      - name: PKGBUILD und .SRCINFO vom Release holen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Beide wurden in Stufe 5 erzeugt, dort im Arch-Container gebaut und
          # gegen das Release-Archiv geprueft, signiert und attestiert. Hier
          # wird nur noch gepusht.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'PKGBUILD' --pattern 'ugos-cli.SRCINFO' --dir . --clobber
          # Der Punkt kommt erst hier wieder davor; am Release traegt die
          # Datei ihn nicht, weil GitHub sie sonst umbenennt.
          mv ugos-cli.SRCINFO .SRCINFO
          grep -q "^pkgver=${VERSION}$" PKGBUILD || {
            echo "::error::UG7601 PKGBUILD traegt nicht pkgver=${VERSION}"; exit 1; }
          grep -q "^\tpkgver = ${VERSION}$" .SRCINFO || {
            echo "::error::UG7602 .SRCINFO traegt nicht pkgver = ${VERSION}"; exit 1; }
      - name: Das Paket bauen und gegen das Release-Archiv pruefen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Erst hier moeglich: makepkg holt seine Quellen von der
          # Release-URL, und das Release ist seit Stufe 7 sichtbar. Gebaut
          # wird also gegen genau die Bytes, die auch die Nutzer bekommen.
          # Eigenes Mount-Verzeichnis, siehe Stufe 6: das `chown -R builder`
          # im Container wuerde sonst das Arbeitsverzeichnis mitnehmen.
          mkdir -p ./aurwork
          install -m 0644 PKGBUILD ./aurwork/PKGBUILD
          docker run --rm --user root \
            --volume "$PWD/aurwork:/pkg" --workdir /pkg \
            archlinux:base-devel@sha256:a26046b7363dad8e2614858f4313949ae9b05c9c5f31de343a54864b9e20806f \
            bash -euo pipefail -c '
              useradd -m builder
              chown -R builder:builder /pkg
              su builder -c "makepkg --cleanbuild --noconfirm --nocheck"
            '
          sudo chown -R "$(id -u):$(id -g)" ./aurwork
          package=$(find ./aurwork -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)
          if [[ -z "$package" ]]; then
            echo "::error::UG7600 makepkg produced no package"
            exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'ugos-cli-x86_64-unknown-linux-gnu.tar.gz' --dir . --clobber
          mkdir -p /tmp/from-package /tmp/from-archive
          tar -xf "$package" -C /tmp/from-package
          tar -xzf ugos-cli-x86_64-unknown-linux-gnu.tar.gz -C /tmp/from-archive
          for binary in ugos-cli ugos-mcp; do
            cmp "/tmp/from-archive/$binary" "/tmp/from-package/usr/bin/$binary"
          done
          echo "::notice::das gebaute Arch-Paket entspricht dem Release-Archiv"
      - name: Push to the AUR
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          install -m 0600 /dev/null "$RUNNER_TEMP/ssh/aur"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/aur"
          printf '%s\n' "$AUR_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/ssh/aur -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts"
          git -c init.defaultBranch=master clone \
            ssh://aur@aur.archlinux.org/ugos-cli-bin.git "$RUNNER_TEMP/aur"
          install -m 0644 PKGBUILD "$RUNNER_TEMP/aur/PKGBUILD"
          install -m 0644 .SRCINFO "$RUNNER_TEMP/aur/.SRCINFO"
          cd "$RUNNER_TEMP/aur"
          if [[ -z $(git status --short) ]]; then
            echo "::notice::the AUR already carries this version"
            exit 0
          fi
          git config user.name 'ugos-cli release automation'
          git config user.email 'fabian@schmieder.eu'
          git add PKGBUILD .SRCINFO
          git commit -m "ugos-cli-bin ${VERSION}-1"
          git push origin HEAD:master
      # Ein angenommener Push sagt nichts darueber, was das AUR ausliefert.
      # Gelesen wird deshalb oeffentlich und anonym, nicht ueber denselben
      # SSH-Zugang, mit dem geschrieben wurde.
      - name: Das AUR zurueckholen und gegen die qualifizierten Dateien pruefen
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/aur-readback"
          git clone --quiet --depth 1 \
            https://aur.archlinux.org/ugos-cli-bin.git "$RUNNER_TEMP/aur-readback"
          for file in PKGBUILD .SRCINFO; do
            if [[ ! -f "$RUNNER_TEMP/aur-readback/$file" ]]; then
              echo "::error::UG7610 $file fehlt im oeffentlichen AUR-Repository"
              exit 1
            fi
            cmp "$file" "$RUNNER_TEMP/aur-readback/$file"
            echo "  ok $file"
          done
          # Und die Paketdatenbank selbst, nicht nur das Git dahinter. Die RPC
          # braucht einen Moment nach dem Push, deshalb mit Frist.
          deadline=$(( SECONDS + 600 ))
          while :; do
            served=$(curl -sS --max-time 30 \
              "https://aur.archlinux.org/rpc/v5/info?arg[]=ugos-cli-bin" \
              | jq -r 'try (.results[0].Version) catch ""')
            if [[ "$served" == "${VERSION}-1" ]]; then
              echo "::notice::das AUR fuehrt ugos-cli-bin ${served}"
              break
            fi
            if (( SECONDS > deadline )); then
              echo "::error::UG7611 die AUR-RPC meldet '${served:-nichts}' statt ${VERSION}-1"
              exit 1
            fi
            sleep 20
          done

  publish-crates:
    name: Publish to crates.io
    needs: [metadata, channel-preflight, stage]
    if: needs.channel-preflight.outputs.publish_crates == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
      - run: rustup show
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          # Nur ugos-client hat kein `publish = false`; cargo bestimmt die
          # Reihenfolge selbst. Keine Wiederholschleife und kein `|| true`:
          # ein gescheiterter Publish muss die Pipeline anhalten.
          cargo publish --workspace --locked
      - name: Nachsehen, ob crates.io die Version ausliefert
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 600 ))
          while :; do
            found=$(curl -sS --max-time 30 -H 'User-Agent: ugos-cli release pipeline' \
              "https://crates.io/api/v1/crates/ugos-client/${VERSION}" \
              | jq -r 'try .version.num catch ""')
            if [[ "$found" == "$VERSION" ]]; then
              echo "::notice::crates.io liefert ugos-client ${VERSION}"
              break
            fi
            if (( SECONDS > deadline )); then
              echo "::error::UG7700 crates.io liefert ugos-client ${VERSION} nicht innerhalb der Frist"
              exit 1
            fi
            sleep 20
          done

  # Stufe 9. Befoerdern. Erst wenn jeder konfigurierte Kanal durch ist, wird
  # aus der Vorabversion `latest`. Die Assets werden dabei nicht angefasst.
  # Ein uebersprungener Kanal blockiert nicht, ein gescheiterter schon.
  promote:
    name: Auf latest befoerdern
    needs: [metadata, stage, publish-apt, update-homebrew, publish-aur, publish-crates]
    if: >-
      always()
      && needs.metadata.outputs.is_prerelease == 'false'
      && needs.stage.result == 'success'
      && needs.update-homebrew.result == 'success'
      && needs.publish-apt.result != 'failure'
      && needs.publish-aur.result != 'failure'
      && needs.publish-crates.result != 'failure'
      && needs.publish-apt.result != 'cancelled'
      && needs.publish-aur.result != 'cancelled'
      && needs.publish-crates.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Vorabkennung entfernen und latest setzen
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          pre=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          [[ "$pre" == false && "$latest" == "$TAG" ]] || {
            echo "::error::UG7110 $TAG ist nicht befoerdert (prerelease=$pre latest=$latest)"
            exit 1; }
          echo "::notice::$TAG ist jetzt latest"
