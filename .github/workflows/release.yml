name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to build and publish.
        required: true
        type: string
    # All declared optional, the Homebrew token included. The values live in
    # the "release" environment rather than as repository secrets, and
    # `secrets: inherit` forwards only repository and organisation secrets. A
    # `required: true` would therefore fail every job that carries no
    # `environment: release`, before it does anything at all. The jobs that
    # need the token read it through their environment; preflight proves it
    # there, before anything public happens.
    secrets:
      HOMEBREW_APP_PRIVATE_KEY:
        required: false
      AUR_SSH_PRIVATE_KEY:
        required: false
      ARCHIVE_DISPATCH_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish.
        required: true
        type: string

# Jobs that need more opt in explicitly.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Stage 1. Establish the identity. Deliberately without an environment and
  # without secrets: this job has to run for a prerelease tag as well, and it
  # changes nothing.
  metadata:
    name: Establish the release identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      source_date_epoch: ${{ steps.identity.outputs.source_date_epoch }}
      is_prerelease: ${{ steps.identity.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Derive version, prerelease marker and build time
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::UG7001 tag must be a canonical vX.Y.Z release tag: $RELEASE_TAG"
            exit 1
          fi
          # The release core without the prerelease suffix. Only it appears in
          # Cargo.toml, and only it may end up in Arch's pkgver, where a hyphen
          # is forbidden. The release identity stays the full tag, and every
          # download URL is built from that.
          version="${RELEASE_TAG#v}"
          core="${version%%-*}"
          if [[ "$core" == "$version" ]]; then
            is_prerelease=false
          else
            is_prerelease=true
          fi
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ "$manifest" != "$core" ]]; then
            echo "::error::UG7002 tag $RELEASE_TAG does not match Cargo.toml version $manifest"
            exit 1
          fi
          # The tag has to point at the commit the run comes from, or the run
          # comes from the protected default branch. The two are equivalent,
          # because the tag is what gets built either way: every build job
          # checks out `inputs.tag`. What this check adds is the provenance of
          # the workflow file, and for that the default branch is the second
          # legitimate source. Without that branch a prerelease could never be
          # resumed after a pipeline fix, because the fix by definition does
          # not sit at the old tag.
          tagged=$(git rev-parse "${RELEASE_TAG}^{}")
          if [[ "$tagged" != "$GITHUB_SHA" && "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::UG7003 tag $RELEASE_TAG points at $tagged, the run comes from $GITHUB_SHA on $GITHUB_REF_NAME"
            exit 1
          fi
          if [[ "$tagged" != "$GITHUB_SHA" ]]; then
            echo "::notice::resuming from $DEFAULT_BRANCH; $RELEASE_TAG is still what gets built"
          fi
          # Deterministic builds need a fixed clock; the tagged commit is it.
          epoch=$(git log -1 --pretty=%ct)
          {
            echo "version=$core"
            echo "source_date_epoch=$epoch"
            echo "is_prerelease=$is_prerelease"
          } >> "$GITHUB_OUTPUT"
      - name: Never touch a release that is already published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # A draft is the normal case; a prerelease is the state after a
          # failed channel and is explicitly resumable, because it carries no
          # `latest` and nobody installs it automatically. That is what the
          # staging is for. The only abort is on a promoted release, whose
          # metadata already sits with users.
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"' 2>/dev/null || echo absent)
          case "$state" in
            absent)       echo "::notice::no release under $TAG, stage 7 creates a draft" ;;
            "true "*)     echo "::notice::a draft exists under $TAG" ;;
            "false true") echo "::notice::resuming the prerelease under $TAG" ;;
            "false false") echo "::error::UG7004 release $TAG is already promoted"; exit 1 ;;
            *)            echo "::error::UG7005 unexpected release state for $TAG: $state"; exit 1 ;;
          esac

  # Stage 6. Channel preflight. Proves access and nothing else; it changes
  # nothing. A prerelease tag never reaches stage 8 and needs no channel
  # access, so this job is deliberately absent there.
  channel-preflight:
    name: Prove the channel credentials
    needs: [metadata]
    if: needs.metadata.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      publish_apt: ${{ steps.channels.outputs.apt }}
      publish_aur: ${{ steps.channels.outputs.aur }}
      publish_crates: ${{ steps.crates.outputs.crates }}
    steps:
      # A token with explicit permission inputs. If the installation lacks one
      # of them, minting already fails; failing later, halfway through a write,
      # would be the worse place.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: tap-token
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: metaneutrons
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
          permission-checks: read
          permission-statuses: read
          permission-administration: read
      - name: Check the installation, not the caller's role
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          set -euo pipefail
          # `permissions.push` in a repository response describes the caller's
          # role, not what the installation is allowed to do. So the question
          # asked is what the installation actually reaches.
          reached=$(gh api installation/repositories --jq '[.repositories[].full_name] | sort | join(",")')
          if [[ "$reached" != "metaneutrons/homebrew-tap" ]]; then
            echo "::error::UG7011 the installation reaches '$reached' instead of exactly metaneutrons/homebrew-tap"
            exit 1
          fi
          # The bot through its public endpoint. `/user` does not apply to an
          # installation token and answered misleadingly.
          bot=$(gh api "users/metaneutrons-homebrew%5Bbot%5D" --jq '"\(.login) \(.id)"')
          echo "::notice::installation reaches $reached, bot $bot"
      - name: Decide which package channels are configured
        id: channels
        env:
          ARCHIVE_DISPATCH_CLIENT_ID: ${{ vars.ARCHIVE_DISPATCH_CLIENT_ID }}
          ARCHIVE_DISPATCH_PRIVATE_KEY: ${{ secrets.ARCHIVE_DISPATCH_PRIVATE_KEY }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_SSH_KNOWN_HOSTS: ${{ vars.AUR_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          # A channel runs only when fully configured. Missing configuration
          # skips it; partial configuration is an error, because it usually
          # means a secret was renamed and would fail halfway through.
          #
          # stdout carries nothing but true or false. The output goes into an
          # assignment in GITHUB_OUTPUT, and a second line would turn it into a
          # multi-line value the file command rejects. Messages therefore go to
          # stderr; they read the same way in the log.
          #
          # The App pair only: signing key and R2 access live in the archive
          # repository, not here. No stored PAT.
          apt_names=(ARCHIVE_DISPATCH_CLIENT_ID ARCHIVE_DISPATCH_PRIVATE_KEY)
          aur_names=(AUR_SSH_PRIVATE_KEY AUR_SSH_KNOWN_HOSTS)

          decide() {
            local channel=$1; shift
            local present=0 missing=0 name
            for name in "$@"; do
              if [[ -n "${!name:-}" ]]; then present=$((present + 1)); else missing=$((missing + 1)); fi
            done
            if (( present == 0 )); then
              echo "::notice::$channel is not configured and will be skipped" >&2
              printf 'false'
            elif (( missing > 0 )); then
              echo "::error::UG7020 $channel is only partly configured; $missing value(s) missing" >&2
              return 1
            else
              printf 'true'
            fi
          }

          # Assignment and call have to stand apart. Written as
          # echo "apt=$(decide ...)" a failure of decide stays without effect,
          # because the exit status is echo's; a half-configured channel would
          # then carry on despite UG7020.
          apt=$(decide APT "${apt_names[@]}")
          aur=$(decide AUR "${aur_names[@]}")
          echo "apt=$apt" >> "$GITHUB_OUTPUT"
          echo "aur=$aur" >> "$GITHUB_OUTPUT"
      - name: Does the crate exist on crates.io yet?
        id: crates
        run: |
          set -euo pipefail
          # Trusted publishing presupposes an existing crate; the first version
          # is published once by hand. While it is missing, the channel counts
          # as unconfigured and is skipped.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -H 'User-Agent: ugos-cli release pipeline' \
            'https://crates.io/api/v1/crates/ugos-client')
          case "$code" in
            200) echo "crates=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "::notice::ugos-client does not exist on crates.io yet; the channel is skipped"
                 echo "crates=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "::error::UG7030 crates.io answers with HTTP $code"; exit 1 ;;
          esac
      # No /api/v1/me as a precheck: that answers 403 even with a valid token.
      # What gets proven is the later path itself, by minting a short-lived
      # token and discarding it.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: steps.crates.outputs.crates == 'true'

  build:
    name: Build (${{ matrix.target }})
    needs: [metadata]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
      # No dtolnay/rust-toolchain: the version stands in rust-toolchain.toml
      # and rustup installs it from there, exactly as CI does. The action would
      # otherwise attach the target triple to the current stable, while cargo
      # in the repository uses the pinned toolchain. On a cross build the
      # standard library is then missing there, and rustc aborts with E0463.
      - run: rustup show
      - name: Add the target triple to the pinned toolchain
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} -p ugos-cli -p ugos-mcp
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          tar czf ../../../ugos-cli-${{ matrix.target }}.tar.gz ugos-cli ugos-mcp
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          7z a ../../../ugos-cli-${{ matrix.target }}.zip ugos-cli.exe ugos-mcp.exe
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ugos-cli-${{ matrix.target }}
          path: |
            ugos-cli-${{ matrix.target }}.tar.gz
            ugos-cli-${{ matrix.target }}.zip

  package-deb:
    name: Debian package (${{ matrix.arch }})
    needs: [metadata, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ugos-cli-${{ matrix.target }}
          path: ./archives
      - name: Build the package from the released archive
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          scripts/release/build-deb.sh \
            --archive "./archives/ugos-cli-${{ matrix.target }}.tar.gz" \
            --arch "${{ matrix.arch }}" \
            --version "$VERSION" \
            --output-dir ./debs \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
      - name: Verify the package installs and runs
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          deb="./debs/ugos-cli_${VERSION}_${{ matrix.arch }}.deb"
          dpkg-deb --contents "$deb"
          # Only the native architecture can actually be installed here.
          if [[ "${{ matrix.arch }}" == amd64 ]]; then
            sudo dpkg -i "$deb"
            installed=$(ugos-cli --version)
            [[ "$installed" == "ugos ${VERSION}" ]] || {
              echo "::error::UG7310 installed binary reports '$installed'"; exit 1; }
            # ugos-mcp speaks MCP on stdio and has no --version to ask, so
            # only its presence and mode are checked here.
            [[ -x /usr/bin/ugos-mcp ]] || {
              echo "::error::UG7311 ugos-mcp is missing or not executable"; exit 1; }
            sudo dpkg -r ugos-cli
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ugos-cli-deb-${{ matrix.arch }}
          path: ./debs/*.deb

  # Stage 3. Sign and attest. Cosign keyless through the run's OIDC identity,
  # plus one SPDX SBOM per payload. The SBOMs get no bundle of their own; they
  # are covered by SHA256SUMS and the attestation.
  sign:
    name: Sign and attest the payloads
    needs: [metadata, build, package-deb]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ./incoming
      - name: Collect the payloads into one flat directory
        run: |
          set -euo pipefail
          mkdir -p ./payload
          find ./incoming -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' \) \
            -exec cp -f {} ./payload/ ';'
          count=$(find ./payload -type f | wc -l | tr -d ' ')
          # Six archives plus two .deb files. The number stands here once and
          # nowhere else; the later stages derive their expectation from it.
          if [[ "$count" != 8 ]]; then
            echo "::error::UG7200 expected 8 payloads, found $count"
            ls -1 ./payload
            exit 1
          fi
          ls -1 ./payload
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: One SBOM and signature bundle per payload
        run: |
          set -euo pipefail
          for payload in ./payload/*; do
            name=$(basename "$payload")
            # The full name stays, even where it already carries .tar.gz or
            # .deb: otherwise the archive and the package of the same
            # architecture would collide in one file.
            syft scan "file:${payload}" -o "spdx-json=./payload/${name}.spdx.json" -q
            cosign sign-blob --yes \
              --bundle "./payload/${name}.sigstore.json" "$payload"
            echo "  signiert $name"
          done
      - name: Attest every payload
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ./payload/*.tar.gz
            ./payload/*.zip
            ./payload/*.deb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-payloads
          path: ./payload/*
          if-no-files-found: error

  # Stage 4. Enforce completeness. An intermediate step, not the final
  # acceptance: every payload needs its payload, SBOM and bundle, and every
  # signature and attestation has to hold.
  aggregate:
    name: Payload completeness
    needs: [metadata, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-payloads
          path: ./payload
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Count, then verify signatures and attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          payloads=()
          while IFS= read -r file; do payloads+=("$file"); done < <(
            find ./payload -maxdepth 1 -type f \
              \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' \) | sort)
          if (( ${#payloads[@]} != 8 )); then
            echo "::error::UG7201 expected 8 payloads, found ${#payloads[@]}"
            exit 1
          fi
          total=$(find ./payload -maxdepth 1 -type f | wc -l | tr -d ' ')
          if (( total != 24 )); then
            echo "::error::UG7202 expected 24 files, that is payload, SBOM and bundle each; found $total"
            ls -1 ./payload
            exit 1
          fi
          for payload in "${payloads[@]}"; do
            name=$(basename "$payload")
            [[ -f "./payload/${name}.spdx.json" ]] || {
              echo "::error::UG7203 SBOM is missing for $name"; exit 1; }
            [[ -f "./payload/${name}.sigstore.json" ]] || {
              echo "::error::UG7204 signature bundle is missing for $name"; exit 1; }
            # The identity is checked as a pattern. For a reusable workflow the
            # ref in the certificate is the caller's, not the tag's; it stays
            # bound to this repository and this workflow file.
            cosign verify-blob \
              --bundle "./payload/${name}.sigstore.json" \
              --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$payload"
            gh attestation verify "$payload" --repo "$GITHUB_REPOSITORY" \
              --deny-self-hosted-runners
            echo "  ok $name"
          done
          echo "::notice::8 payloads verified with SBOM, signature and attestation"

  # Stage 5a. Produce the channel metadata from the qualified payloads and
  # qualify it right away: the Arch packaging builds here and is checked
  # against the release archive before anything is published. The metadata is
  # signed and attested like a payload; it needs no SBOM of its own.
  channel-metadata:
    name: Produce and qualify the channel metadata
    needs: [metadata, sign, aggregate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-payloads
          path: ./payload
      - name: Write the Homebrew formula
        run: |
          set -euo pipefail

          checksum() {
            local target=$1
            local path="./payload/ugos-cli-${target}.tar.gz"
            if [[ ! -f "$path" ]]; then
              echo "::error::UG7500 release archive is missing: $path" >&2
              exit 1
            fi
            sha256sum "$path" | cut -d' ' -f1
          }

          # Every download URL is built from the full tag, not from v$VERSION.
          # For a prerelease tag those are two different things, and the file
          # sits under the tag.
          MAC_X64_SHA=$(checksum x86_64-apple-darwin)
          MAC_ARM64_SHA=$(checksum aarch64-apple-darwin)
          LINUX_X64_SHA=$(checksum x86_64-unknown-linux-gnu)
          LINUX_ARM64_SHA=$(checksum aarch64-unknown-linux-gnu)

          cat > formula.rb <<RUBY
          class UgosCli < Formula
            desc "CLI and MCP server for UGREEN NAS (UGOS) management"
            homepage "https://github.com/metaneutrons/ugos-cli"
            license "GPL-3.0-or-later"

            on_macos do
              if Hardware::CPU.intel?
                url "https://github.com/metaneutrons/ugos-cli/releases/download/${TAG}/ugos-cli-x86_64-apple-darwin.tar.gz"
                sha256 "${MAC_X64_SHA}"
              else
                url "https://github.com/metaneutrons/ugos-cli/releases/download/${TAG}/ugos-cli-aarch64-apple-darwin.tar.gz"
                sha256 "${MAC_ARM64_SHA}"
              end
            end

            on_linux do
              if Hardware::CPU.intel?
                url "https://github.com/metaneutrons/ugos-cli/releases/download/${TAG}/ugos-cli-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${LINUX_X64_SHA}"
              else
                url "https://github.com/metaneutrons/ugos-cli/releases/download/${TAG}/ugos-cli-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${LINUX_ARM64_SHA}"
              end
            end

            def install
              bin.install "ugos-cli"
              bin.install "ugos-mcp"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/ugos-cli --version")
            end
          end
          RUBY

          ruby -c formula.rb
          if [[ $(grep -Fc "/releases/download/${TAG}/" formula.rb) != 4 ]]; then
            echo "::error::UG7501 formula does not reference four exact release URLs"
            exit 1
          fi
          mkdir -p ./meta
          install -m 0644 formula.rb ./meta/ugos-cli.rb
      - name: Write PKGBUILD and .SRCINFO
        run: |
          set -euo pipefail
          x86=$(sha256sum ./payload/ugos-cli-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          arm=$(sha256sum ./payload/ugos-cli-aarch64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          cat > PKGBUILD <<PKG
          # Maintainer: Fabian Schmieder <fabian@schmieder.eu>
          pkgname=ugos-cli-bin
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="CLI and MCP server for UGREEN NAS (UGOS) management"
          arch=('x86_64' 'aarch64')
          # A -bin package ships the upstream binaries, which means unchanged.
          # makepkg would otherwise strip them and split off the debug symbols;
          # the package would then hold different bytes than the release
          # archive, and the comparison afterwards could never match.
          options=('!strip' '!debug')
          url="https://github.com/metaneutrons/ugos-cli"
          license=('GPL-3.0-or-later')
          provides=('ugos-cli')
          conflicts=('ugos-cli')
          source_x86_64=("\${pkgname}-\${pkgver}-x86_64.tar.gz::${base}/ugos-cli-x86_64-unknown-linux-gnu.tar.gz")
          source_aarch64=("\${pkgname}-\${pkgver}-aarch64.tar.gz::${base}/ugos-cli-aarch64-unknown-linux-gnu.tar.gz")
          sha256sums_x86_64=('${x86}')
          sha256sums_aarch64=('${arm}')

          package() {
            install -Dm755 "\${srcdir}/ugos-cli" "\${pkgdir}/usr/bin/ugos-cli"
            install -Dm755 "\${srcdir}/ugos-mcp" "\${pkgdir}/usr/bin/ugos-mcp"
          }
          PKG
          cat PKGBUILD
          # Only --printsrcinfo, no build. makepkg would fetch its sources from
          # the release URL, and the release does not exist before stage 7. The
          # build and the comparison against the archive therefore sit in the
          # AUR job, before the push and after publication.
          #
          # A directory of its own is mounted rather than the workspace:
          # makepkg does not run as root, and the `chown -R builder` that needs
          # would otherwise drag everything beside it onto a foreign UID.
          # Ownership is taken back afterwards.
          mkdir -p ./aurwork
          install -m 0644 PKGBUILD ./aurwork/PKGBUILD
          docker run --rm --user root \
            --volume "$PWD/aurwork:/pkg" --workdir /pkg \
            archlinux:base-devel@sha256:a26046b7363dad8e2614858f4313949ae9b05c9c5f31de343a54864b9e20806f \
            bash -euo pipefail -c '
              useradd -m builder
              chown -R builder:builder /pkg
              su builder -c "makepkg --printsrcinfo > .SRCINFO"
            '
          sudo chown -R "$(id -u):$(id -g)" ./aurwork
          [[ -s ./aurwork/.SRCINFO ]] || { echo "::error::UG7603 .SRCINFO is empty"; exit 1; }
          install -m 0644 PKGBUILD ./meta/PKGBUILD
          # As ugos-cli.SRCINFO, not as .SRCINFO: GitHub renames a release
          # asset with a leading dot to default.SRCINFO. The AUR job puts the
          # dot back before the push; what is signed and attested is the
          # content, not the name.
          install -m 0644 ./aurwork/.SRCINFO ./meta/ugos-cli.SRCINFO
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the metadata
        run: |
          set -euo pipefail
          for file in ./meta/ugos-cli.rb ./meta/PKGBUILD ./meta/ugos-cli.SRCINFO; do
            name=$(basename "$file")
            cosign sign-blob --yes --bundle "./meta/${name}.sigstore.json" "$file"
            echo "  signiert $name"
          done
      - name: Attest the metadata
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ./meta/ugos-cli.rb
            ./meta/PKGBUILD
            ./meta/ugos-cli.SRCINFO
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: channel-metadata
          path: ./meta/*
          include-hidden-files: true
          if-no-files-found: error

  # Stage 5b. Final acceptance. The expected list arises from the payloads and
  # the channel metadata actually produced, not from a second constant. Only
  # then is SHA256SUMS written, and its set of lines coincides exactly with
  # that list. After this job no stage may add or change an asset.
  candidate:
    name: Final release list
    needs: [metadata, sign, aggregate, channel-metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-payloads
          path: ./release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: channel-metadata
          path: ./release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Form the list, verify everything, then write SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd ./release

          signed=()
          while IFS= read -r file; do signed+=("${file#./}"); done < <(
            find . -maxdepth 1 -type f \
              \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' \
                 -o -name 'ugos-cli.rb' -o -name 'PKGBUILD' -o -name 'ugos-cli.SRCINFO' \) | sort)
          # Eight payloads plus three metadata files.
          if (( ${#signed[@]} != 11 )); then
            echo "::error::UG7210 expected 11 signed files, found ${#signed[@]}"
            ls -1a
            exit 1
          fi

          expected=()
          for file in "${signed[@]}"; do
            expected+=("$file" "${file}.sigstore.json")
            case "$file" in
              *.tar.gz|*.zip|*.deb) expected+=("${file}.spdx.json") ;;
            esac
            [[ -f "${file}.sigstore.json" ]] || {
              echo "::error::UG7211 signature bundle is missing for $file"; exit 1; }
            cosign verify-blob \
              --bundle "${file}.sigstore.json" \
              --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$file"
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --deny-self-hosted-runners
            echo "  ok $file"
          done

          # The files present against the expected list, in both directions.
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          find . -maxdepth 1 -type f | sed 's|^\./||' | sort > /tmp/present
          if ! diff -u /tmp/expected /tmp/present; then
            echo "::error::UG7212 the candidate list differs from the directory"
            exit 1
          fi

          sha256sum "${expected[@]}" > SHA256SUMS
          lines=$(wc -l < SHA256SUMS | tr -d ' ')
          if (( lines != ${#expected[@]} )); then
            echo "::error::UG7213 SHA256SUMS has $lines lines, expected ${#expected[@]}"
            exit 1
          fi
          sha256sum --check --quiet SHA256SUMS
          echo "::notice::${#expected[@]} assets plus SHA256SUMS accepted"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: ./release/*
          include-hidden-files: true
          if-no-files-found: error

  stage:
    name: Staged prerelease
    needs: [metadata, channel-preflight, candidate]
    if: >-
      !cancelled()
      && needs.metadata.result == 'success'
      && needs.candidate.result == 'success'
      && (
        (needs.metadata.outputs.is_prerelease == 'true'
          && needs.channel-preflight.result == 'skipped')
        || (needs.metadata.outputs.is_prerelease == 'false'
          && needs.channel-preflight.result == 'success')
      )
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: ./candidate
      - name: Create a draft if none exists
        run: |
          set -euo pipefail
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"' 2>/dev/null || echo absent)
          case "$state" in
            absent)        gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --notes "Pipeline-Testlauf." ;;
            "true "*)      echo "::notice::filling the draft release-please created" ;;
            "false true")  echo "::notice::refilling the existing prerelease" ;;
            "false false") echo "::error::UG7004 release $TAG is already promoted"; exit 1 ;;
          esac
      # No more softprops/action-gh-release: the action derives its tag context
      # from GITHUB_REF rather than from tag_name. On a run from the default
      # branch it therefore looks for a release on refs/heads/main and gets a
      # 403. `gh release upload` knows only the tag it is handed. The draft
      # state is carried by the steps before and after anyway, not by the
      # action.
      - name: Upload to GitHub Release
        run: |
          set -euo pipefail
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber candidate/*
          echo "::notice::$(find ./candidate -maxdepth 1 -type f | wc -l | tr -d ' ') assets uploaded"
      - name: Read the bytes back from the draft and check them against the candidates
        run: |
          set -euo pipefail
          # A successful upload says nothing about what hangs on the release.
          # What is checked is what comes back from there.
          #
          # candidate is already flat; it is exactly the list accepted in stage
          # 5b.
          mkdir -p ./flat ./staged
          find ./candidate -maxdepth 1 -type f -exec cp -f {} ./flat/ ';'
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir ./staged --clobber

          status=0
          for path in ./flat/*; do
            name=$(basename "$path")
            if [[ ! -f "./staged/$name" ]]; then
              echo "::error::UG7100 $name is missing from the release"
              status=1
              continue
            fi
            cmp "$path" "./staged/$name"
            echo "  ok $name"
          done
          (( status == 0 )) || exit 1

          # The release must carry nothing extra either: a file that is not a
          # candidate would be left over from an earlier run.
          for path in ./staged/*; do
            name=$(basename "$path")
            [[ -f "./flat/$name" ]] || {
              echo "::error::UG7101 the release carries a foreign asset: $name"
              status=1; }
          done
          (( status == 0 )) || exit 1

          # The checksum file applies to the bytes from the release, not to the
          # local candidates: otherwise it would be checking itself.
          ( cd ./staged && sha256sum --check --quiet SHA256SUMS )
          echo "::notice::$(find ./flat -type f | wc -l | tr -d ' ') assets verified, SHA256SUMS confirmed against the release"
      - name: Make it visible as a prerelease, without latest
        run: |
          set -euo pipefail
          # No `|| true` on a publication path. The state is switched only when
          # it needs switching; a resumed prerelease is already right.
          before=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')
          if [[ "$before" != "false true" ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft=false --prerelease --latest=false
          fi
          read -r draft pre < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')
          [[ "$draft" == false && "$pre" == true ]] || {
            echo "::error::UG7102 $TAG is not visible as a prerelease (draft=$draft prerelease=$pre)"
            exit 1; }
          # `latest` is not a field of the release but a choice of the
          # repository. So the question asked is what the repository serves.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || echo none)
          [[ "$latest" != "$TAG" ]] || {
            echo "::error::UG7103 $TAG already stands as latest although no channel has run"
            exit 1; }
          echo "::notice::$TAG is visible as a prerelease, latest stands at $latest"


  # After the promote, not before it. The archive reads stable releases only;
  # stage deliberately publishes a prerelease. A dispatch before that asks for
  # something that cannot exist yet, and the archive aborts:
  #
  #   AR170 no stable release carries a .deb for the declared packages
  #
  # Because promote used to wait on publish-apt, the release then never became
  # stable either: the channel was unsatisfiable and held back the promotion
  # that would have satisfied it. That is exactly what bups v0.3.2 died of.
  #
  # APT is not a channel this repository publishes into. It holds neither a
  # signing key nor bucket access; it hangs attested payloads on its release,
  # and the archive fetches them. A consumer can only act once what it consumes
  # is finished. A failure here can therefore roll nothing back, and needs not
  # to: the archive keeps serving the previous version until the dispatch is
  # repeated.
  publish-apt:
    name: Ask the archive to publish
    needs: [metadata, channel-preflight, promote]
    # With a status function, or the skip propagates through. promote carries
    # `always()` and catches a skipped publish-crates; without `!cancelled()`
    # this job inherits the skip anyway, although its direct predecessor
    # succeeded. That is exactly how the APT dispatch went missing at 0.13.2:
    # every credential in place, promote green, job skipped regardless.
    if: >-
      !cancelled()
      && needs.promote.result == 'success'
      && needs.channel-preflight.outputs.publish_apt == 'true'
      && needs.metadata.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      ARCHIVE_REPO: metaneutrons/apt-archive
      ARCHIVE_DOMAIN: metaneutrons.cc
      ARCHIVE_PROJECT: ugos-cli
      DEB_PACKAGE: ugos-cli
    steps:
      # This repository uploads nothing and holds no signing key. An R2 token
      # can be limited to a bucket, not to a prefix; write access per project
      # would be write access to the whole archive. The .deb files hang attested
      # on the release, and the archive fetches them from there.
      #
      # The token is minted immediately before use, for exactly one repository
      # and exactly two permissions, and falls away at the end of the job. A
      # stored PAT would be a long-lived master key.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: archive-token
        with:
          client-id: ${{ vars.ARCHIVE_DISPATCH_CLIENT_ID }}
          private-key: ${{ secrets.ARCHIVE_DISPATCH_PRIVATE_KEY }}
          owner: metaneutrons
          repositories: apt-archive
          permission-actions: write
          permission-contents: read

      # The contract is read, not assumed. Whether the archive keeps a prefix
      # per project or puts everything at the domain root is decided by the
      # manifest; a URL written down here would be silently wrong at the next
      # rebuild of the archive.
      - name: Read the domain contract from the manifest
        id: contract
        env:
          GH_TOKEN: ${{ steps.archive-token.outputs.token }}
        run: |
          set -euo pipefail
          gh api "repos/${ARCHIVE_REPO}/contents/domains/${ARCHIVE_DOMAIN}/manifest.toml" \
            --jq .content | base64 -d > manifest.toml
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, sys, tomllib
          # Every environment value first, so that no error path has to look
          # something up itself and raise an exception instead of the message.
          project = os.environ["ARCHIVE_PROJECT"]
          package = os.environ["DEB_PACKAGE"]
          domain = os.environ.get("ARCHIVE_DOMAIN", "the domain")
          with open("manifest.toml", "rb") as fh:
              m = tomllib.load(fh)
          entry = next((p for p in m.get("projects", []) if p.get("name") == project), None)
          if entry is None:
              sys.exit(f"::error::UG7440 {project} is not in the manifest of {domain}")
          if package not in entry.get("packages", []):
              sys.exit(f"::error::UG7441 {package} is not listed under packages of {project}")
          rel, dom = m["release"], m["domain"]
          if "main" not in rel.get("components", []):
              sys.exit("::error::UG7442 the component main is missing from the manifest")
          for arch in ("amd64", "arm64"):
              if arch not in rel.get("architectures", []):
                  sys.exit(f"::error::UG7443 the architecture {arch} is missing from the manifest")
          # Unified: one shared archive at the domain root, pool/ and dists/ for
          # every project together. A project prefix would be a different
          # layout, and every URL built here would then point nowhere.
          prefix = (entry.get("prefix") or "").strip("/")
          if prefix:
              sys.exit(f"::error::UG7444 the manifest keeps the prefix /{prefix} for {project}; a shared archive at the domain root is expected")
          print(f"base_url={dom['base_url'].rstrip('/')}")
          print(f"suite={rel['codename']}")
          PY
          echo "::notice::contract: $(grep base_url "$GITHUB_OUTPUT" | tail -1), $(grep suite= "$GITHUB_OUTPUT" | tail -1)"

      # The reviewed workflow on the protected default branch, with named
      # inputs. A repository_dispatch would be a blind event that says nothing
      # about which workflow is to run on which ref.
      - name: Dispatch the archive workflow
        id: dispatch
        env:
          GH_TOKEN: ${{ steps.archive-token.outputs.token }}
        run: |
          set -euo pipefail
          branch=$(gh api "repos/${ARCHIVE_REPO}" --jq .default_branch)
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "since=$since" >> "$GITHUB_OUTPUT"
          gh workflow run publish.yml --repo "$ARCHIVE_REPO" --ref "$branch" \
            -f domain="$ARCHIVE_DOMAIN" -f project="$ARCHIVE_PROJECT"
          echo "::notice::publish.yml dispatched on ${ARCHIVE_REPO}@${branch}"

      # For correlation in the log only. The run is looked up by its start
      # time, not as "the newest one": with two dispatches in quick succession
      # that would be the wrong one. Finding none unambiguously is not an error,
      # because the proof stands further down at the public archive.
      - name: Correlate the dispatched run
        continue-on-error: false
        env:
          GH_TOKEN: ${{ steps.archive-token.outputs.token }}
          SINCE: ${{ steps.dispatch.outputs.since }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 10); do
            ids=$(gh run list --repo "$ARCHIVE_REPO" --workflow publish.yml \
              --event workflow_dispatch --limit 20 \
              --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"$SINCE\") | .databaseId] | @tsv")
            count=$(printf '%s' "$ids" | wc -w | tr -d ' ')
            if [[ "$count" == 1 ]]; then
              echo "::notice::run ${ids} in the archive"
              break
            fi
            if [[ "$count" -gt 1 ]]; then
              echo "::notice::several runs since $SINCE, no unambiguous correlation; the archive itself is what gets checked"
              break
            fi
            sleep 6
          done

      # The actual proof. Neither the dispatch being accepted nor a green job
      # says anything about what the archive serves.
      #
      # And it matters which URL is asked for. An apt client with
      # Acquire-By-Hash never reads
      #   dists/<suite>/main/binary-<arch>/Packages.gz
      # but takes that file's checksum from InRelease and fetches
      #   dists/<suite>/main/binary-<arch>/by-hash/SHA512/<checksum>
      # SHA512 rather than SHA256, because apt asks for the strongest hash
      # named in Release first. If the archive stopped writing that tree, the
      # server would answer 404 and apt would fall back to the mutable path
      # without an error and without a warning; by-hash would then be both
      # declared and ineffective. Asking for the same object turns that silent
      # degradation into a red job.
      #
      # Only the canonical path is cacheable, and the zone caches it for four
      # hours. An earlier comment claimed `Cache-Control: no-store` for
      # dists/** here; measured, it says max-age=14400. At bups v0.3.4 the
      # archive had rendered and signed ninety seconds after the dispatch, the
      # job received a ninety-minute-old copy and reported a publication as
      # failed that had succeeded. InRelease is served uncached.
      - name: Wait until the archive serves the version
        env:
          BASE_URL: ${{ steps.contract.outputs.base_url }}
          SUITE: ${{ steps.contract.outputs.suite }}
        run: |
          set -euo pipefail

          # The checksum block of a Release file. The entries are indented, the
          # next section header and the signature block are not. Terminating on
          # ^[A-Za-z-]+: would match neither "SHA512:" nor "SHA256:", because
          # the character class excludes digits, and every following section
          # would count towards the current one.
          cat > "$RUNNER_TEMP/index-sha.awk" <<'AWK'
          /^SHA512:/               { block = 1; next }
          block && /^[^[:space:]]/ { block = 0 }
          block && $3 == want      { print $1; exit }
          AWK

          # The index is shared: it carries the stanzas of other projects too.
          # The search is strictly for this package, and the upstream part is
          # compared as a string, not as a regular expression. The Debian
          # version string carries a revision; build-deb.sh sets
          # `${version}-1`.
          cat > "$RUNNER_TEMP/pick.awk" <<'AWK'
          BEGIN { prefix = version "-" }
          $1 == "Package:"  { pkg  = $2 }
          $1 == "Version:"  { ver  = $2 }
          $1 == "Filename:" { name = $2 }
          function hit() { return pkg == package && substr(ver, 1, length(prefix)) == prefix }
          # awk runs END after exit as well, hence the flag.
          /^[[:space:]]*$/ { if (hit()) { print name; done = 1; exit } pkg = ""; ver = ""; name = "" }
          END { if (!done && hit()) print name }
          AWK

          # Prints the pool path of this version for one architecture, or
          # nothing. Silent on every failure: the call sits in a wait loop where
          # "not there yet" is the normal answer, and the diagnosis belongs
          # after the deadline.
          cat > "$RUNNER_TEMP/resolve.sh" <<'SH'
          set -euo pipefail
          arch="$1"
          base="${BASE_URL}/dists/${SUITE}"
          curl --fail --silent --location "${base}/InRelease" --output inrelease
          sum=$(awk -v want="main/binary-${arch}/Packages.gz" \
                    -f "$RUNNER_TEMP/index-sha.awk" inrelease)
          [ -n "$sum" ]
          curl --fail --silent --location \
            "${base}/main/binary-${arch}/by-hash/SHA512/${sum}" \
            --output "packages-${arch}.gz"
          # Content-addressed, but the address only means whatever the archive
          # puts behind it. Verified, so that a deviation is noticed rather than
          # parsed.
          printf '%s  %s\n' "$sum" "packages-${arch}.gz" | sha512sum --check --status
          gzip -dc "packages-${arch}.gz" \
            | awk -v package="$DEB_PACKAGE" -v version="$VERSION" -f "$RUNNER_TEMP/pick.awk"
          SH

          deadline=$(( SECONDS + 1500 ))
          while :; do
            amd64=$(bash "$RUNNER_TEMP/resolve.sh" amd64 2>/dev/null || true)
            arm64=$(bash "$RUNNER_TEMP/resolve.sh" arm64 2>/dev/null || true)
            if [[ -n "$amd64" && -n "$arm64" ]]; then
              echo "::notice::${BASE_URL} serves ${VERSION} as ${amd64} and ${arm64}"
              printf 'PUBLISHED_AMD64=%s\nPUBLISHED_ARM64=%s\n' "$amd64" "$arm64" \
                >> "$GITHUB_ENV"
              break
            fi
            if (( SECONDS > deadline )); then
              echo "::error::UG7430 the archive does not serve ${VERSION} within the deadline; the dispatch went out, the cause is in the runs of ${ARCHIVE_REPO}"
              exit 1
            fi
            sleep 30
          done

      # An index that names the version is not yet a served file. The paths come
      # from the step above, so the comparison cannot land on a different
      # generation than the wait did.
      - name: Compare the served package against the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          BASE_URL: ${{ steps.contract.outputs.base_url }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            case "$arch" in
              amd64) filename="$PUBLISHED_AMD64" ;;
              arm64) filename="$PUBLISHED_ARM64" ;;
            esac
            curl --fail --silent --show-error --location \
              "${BASE_URL}/${filename}" --output "published-${arch}.deb"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "ugos-cli_${VERSION}_${arch}.deb" --dir ./release --clobber
            cmp "published-${arch}.deb" "./release/ugos-cli_${VERSION}_${arch}.deb"
            echo "::notice::${arch} is identical to the release asset"
          done

  update-homebrew:
    name: Update Homebrew Tap
    needs: [metadata, channel-preflight, stage]
    runs-on: ubuntu-latest
    environment: release
    # The qualification in the tap runs brew audit, install and test on two
    # macOS runners. This job waits for it, bounded, and mints a fresh token
    # afterwards.
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      TAP_REPO: metaneutrons/homebrew-tap
      VERSION: ${{ needs.metadata.outputs.version }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: tap-token
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: metaneutrons
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
          permission-checks: read
          permission-statuses: read
          permission-administration: read

      - name: Measure the installation and the bot
        id: identity
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          set -euo pipefail
          reached=$(gh api installation/repositories --jq '[.repositories[].full_name] | sort | join(",")')
          if [[ "$reached" != "$TAP_REPO" ]]; then
            echo "::error::UG7510 the installation reaches '$reached' instead of exactly $TAP_REPO"
            exit 1
          fi
          # Git authorship comes from the measured bot identity, not from a
          # guessed name. `/user` does not apply to an installation token, hence
          # the public endpoint.
          read -r login id < <(gh api "users/metaneutrons-homebrew%5Bbot%5D" --jq '"\(.login) \(.id)"')
          {
            echo "bot_login=$login"
            echo "bot_email=${id}+${login}@users.noreply.github.com"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::installation $reached, bot $login"

      - name: Fetch the formula from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The repository token applies only to this repository's release,
          # never to the tap. The formula was produced, qualified, signed and
          # attested in stage 5; it is not built again here.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'ugos-cli.rb' --dir . --clobber
          mv ugos-cli.rb formula.rb
          if [[ $(grep -Fc "/releases/download/${TAG}/" formula.rb) != 4 ]]; then
            echo "::error::UG7506 the formula fetched from the release does not reference four exact release URLs"
            exit 1
          fi

      - name: Branch, commit and pull request in the tap
        id: pr
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
          BOT_LOGIN: ${{ steps.identity.outputs.bot_login }}
          BOT_EMAIL: ${{ steps.identity.outputs.bot_email }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          install -d tap/Formula
          install -m 0644 formula.rb tap/Formula/ugos-cli.rb
          cd tap
          # The qualification in the tap also checks that README.md was
          # generated from the formulas. Without this run the pull request fails
          # on that check rather than on the formula.
          scripts/generate-readme.sh README.md
          if [[ -z $(git status --porcelain) ]]; then
            echo "::notice::the tap already carries this formula"
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "unchanged=false" >> "$GITHUB_OUTPUT"

          # The tap's main is protected: a pull request and the check "Formula
          # qualification" are required, a direct push is refused. The tap
          # requires no reviews.
          branch="ugos-cli-${VERSION}"
          git config user.name "$BOT_LOGIN"
          git config user.email "$BOT_EMAIL"
          git checkout -b "$branch"
          git add Formula/ugos-cli.rb README.md
          git commit -m "Update ugos-cli to ${VERSION}"
          git push --force-with-lease origin "$branch"
          head=$(git rev-parse HEAD)

          pr=$(gh pr list --repo "$TAP_REPO" --head "$branch" --state open \
                 --json number --jq '.[0].number // empty')
          if [[ -z "$pr" ]]; then
            url=$(gh pr create --repo "$TAP_REPO" --base main --head "$branch" \
                    --title "Update ugos-cli to ${VERSION}" \
                    --body "Formel-Bump aus dem Release-Lauf von ugos-cli ${TAG}.")
            pr=${url##*/}
          fi
          if [[ ! "$pr" =~ ^[0-9]+$ ]]; then
            echo "::error::UG7502 no pull request number for $branch"
            exit 1
          fi
          {
            echo "number=$pr"
            echo "head=$head"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::tap pull request #$pr on $head"

      # Bounded to 45 minutes, so that the wait stays inside the lifetime of the
      # first token. A timeout fails closed: it justifies neither a merge nor a
      # second attempt with a broader permission.
      - name: Wait for the qualification
        if: steps.pr.outputs.unchanged == 'false'
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            n=$(gh pr checks "$PR" --repo "$TAP_REPO" --json name --jq 'length' 2>/dev/null || echo 0)
            [[ "${n:-0}" -gt 0 ]] && break
            sleep 10
          done
          set +e
          timeout 2700 gh pr checks "$PR" --repo "$TAP_REPO" --watch --fail-fast --interval 30
          rc=$?
          set -e
          case "$rc" in
            0)   echo "::notice::qualification passed" ;;
            124) echo "::error::UG7504 the qualification was not finished after 45 minutes"; exit 1 ;;
            *)   echo "::error::UG7503 the qualification ended with exit $rc"; exit 1 ;;
          esac

      # A fresh token after the wait. The first may already have expired, and a
      # merge is the last and most expensive write. It is minted even when there
      # was nothing to merge: that way the read-back has exactly one origin
      # instead of a fallback expression neither a reader nor a reviewer can
      # resolve.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: merge-token
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: metaneutrons
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
          permission-checks: read
          permission-statuses: read
          permission-administration: read

      - name: Re-check head, required checks and tap protection, then merge
        if: steps.pr.outputs.unchanged == 'false'
        env:
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
          EXPECTED_HEAD: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          reached=$(gh api installation/repositories --jq '[.repositories[].full_name] | sort | join(",")')
          [[ "$reached" == "$TAP_REPO" ]] || {
            echo "::error::UG7510 the second token reaches '$reached'"; exit 1; }

          head=$(gh pr view "$PR" --repo "$TAP_REPO" --json headRefOid --jq .headRefOid)
          if [[ "$head" != "$EXPECTED_HEAD" ]]; then
            echo "::error::UG7511 the pull request head is $head, what was pushed is $EXPECTED_HEAD"
            exit 1
          fi

          # The protection still applies, and the gate check is still required.
          # Otherwise the qualification would be decoration.
          contexts=$(gh api "repos/${TAP_REPO}/branches/main/protection" \
            --jq '[.required_status_checks.contexts[]] | join(",")')
          if [[ ",$contexts," != *",Formula qualification,"* ]]; then
            echo "::error::UG7512 'Formula qualification' is no longer required on $TAP_REPO (now: $contexts)"
            exit 1
          fi

          state=$(gh pr view "$PR" --repo "$TAP_REPO" --json statusCheckRollup \
            --jq '[.statusCheckRollup[] | select(.name == "Formula qualification")] | last
                  | if . == null then "absent none"
                    else "\((.status // "absent") | ascii_downcase) \((.conclusion // "none") | ascii_downcase)" end')
          if [[ "$state" != "completed success" ]]; then
            echo "::error::UG7513 'Formula qualification' stands at '$state' instead of completed success"
            exit 1
          fi

          gh pr merge "$PR" --repo "$TAP_REPO" --squash --delete-branch

      - name: Read the formula back from main
        env:
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
        run: |
          set -euo pipefail
          gh api "repos/${TAP_REPO}/contents/Formula/ugos-cli.rb?ref=main" \
            --jq .content | base64 --decode > published.rb
          # Byte for byte against the produced asset, not merely checked for the
          # version: a formula can name the right version and still be a
          # different one.
          cmp published.rb formula.rb
          echo "::notice::the formula on $TAP_REPO is byte for byte the produced one"

  publish-aur:
    name: Publish AUR package
    needs: [metadata, channel-preflight, stage]
    if: needs.channel-preflight.outputs.publish_aur == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      AUR_SSH_KNOWN_HOSTS: ${{ vars.AUR_SSH_KNOWN_HOSTS }}
    steps:
      - name: Fetch PKGBUILD and .SRCINFO from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Both were produced in stage 5, built there in the Arch container and
          # checked against the release archive, signed and attested. All that
          # happens here is the push.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'PKGBUILD' --pattern 'ugos-cli.SRCINFO' --dir . --clobber
          # The dot goes back in front only here; on the release the file does
          # not carry it, because GitHub would otherwise rename it.
          mv ugos-cli.SRCINFO .SRCINFO
          grep -qx "pkgver=${VERSION}" PKGBUILD || {
            echo "::error::UG7601 PKGBUILD does not carry pkgver=${VERSION}"; exit 1; }
          # With awk rather than grep: .SRCINFO indents its fields with a tab,
          # and `\t` in a pattern is a matter of dialect. BSD grep reads it as a
          # tab, GNU grep as the character t. The check therefore passed locally
          # and never on the runner.
          awk -v v="$VERSION" '$1 == "pkgver" && $2 == "=" && $3 == v { found = 1 }
                               END { exit !found }' .SRCINFO || {
            echo "::error::UG7602 .SRCINFO does not carry pkgver = ${VERSION}"; exit 1; }
      - name: Build the package and check it against the release archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Only possible here: makepkg fetches its sources from the release
          # URL, and the release has been visible since stage 7. So the build
          # runs against exactly the bytes users get too. A mount directory of
          # its own, see stage 6: the `chown -R builder` in the container would
          # otherwise take the workspace with it.
          mkdir -p ./aurwork
          install -m 0644 PKGBUILD ./aurwork/PKGBUILD
          docker run --rm --user root \
            --volume "$PWD/aurwork:/pkg" --workdir /pkg \
            archlinux:base-devel@sha256:a26046b7363dad8e2614858f4313949ae9b05c9c5f31de343a54864b9e20806f \
            bash -euo pipefail -c '
              useradd -m builder
              chown -R builder:builder /pkg
              su builder -c "makepkg --cleanbuild --noconfirm --nocheck"
            '
          sudo chown -R "$(id -u):$(id -g)" ./aurwork
          package=$(find ./aurwork -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)
          if [[ -z "$package" ]]; then
            echo "::error::UG7600 makepkg produced no package"
            exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'ugos-cli-x86_64-unknown-linux-gnu.tar.gz' --dir . --clobber
          mkdir -p /tmp/from-package /tmp/from-archive
          tar -xf "$package" -C /tmp/from-package
          tar -xzf ugos-cli-x86_64-unknown-linux-gnu.tar.gz -C /tmp/from-archive
          for binary in ugos-cli ugos-mcp; do
            cmp "/tmp/from-archive/$binary" "/tmp/from-package/usr/bin/$binary"
          done
          echo "::notice::the built Arch package matches the release archive"
      - name: Push to the AUR
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          install -m 0600 /dev/null "$RUNNER_TEMP/ssh/aur"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/aur"
          printf '%s\n' "$AUR_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/ssh/aur -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts"
          git -c init.defaultBranch=master clone \
            ssh://aur@aur.archlinux.org/ugos-cli-bin.git "$RUNNER_TEMP/aur"
          install -m 0644 PKGBUILD "$RUNNER_TEMP/aur/PKGBUILD"
          install -m 0644 .SRCINFO "$RUNNER_TEMP/aur/.SRCINFO"
          cd "$RUNNER_TEMP/aur"
          if [[ -z $(git status --short) ]]; then
            echo "::notice::the AUR already carries this version"
            exit 0
          fi
          git config user.name 'ugos-cli release automation'
          git config user.email 'fabian@schmieder.eu'
          git add PKGBUILD .SRCINFO
          git commit -m "ugos-cli-bin ${VERSION}-1"
          git push origin HEAD:master
      # An accepted push says nothing about what the AUR serves. So the read is
      # public and anonymous, not through the same SSH access that wrote.
      - name: Fetch the AUR back and check it against the qualified files
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/aur-readback"
          git clone --quiet --depth 1 \
            https://aur.archlinux.org/ugos-cli-bin.git "$RUNNER_TEMP/aur-readback"
          for file in PKGBUILD .SRCINFO; do
            if [[ ! -f "$RUNNER_TEMP/aur-readback/$file" ]]; then
              echo "::error::UG7610 $file is missing from the public AUR repository"
              exit 1
            fi
            cmp "$file" "$RUNNER_TEMP/aur-readback/$file"
            echo "  ok $file"
          done
          # And the package database itself, not only the git behind it. The RPC
          # needs a moment after the push, hence the deadline.
          deadline=$(( SECONDS + 600 ))
          while :; do
            served=$(curl -sS --max-time 30 \
              "https://aur.archlinux.org/rpc/v5/info?arg[]=ugos-cli-bin" \
              | jq -r 'try (.results[0].Version) catch ""')
            if [[ "$served" == "${VERSION}-1" ]]; then
              echo "::notice::the AUR carries ugos-cli-bin ${served}"
              break
            fi
            if (( SECONDS > deadline )); then
              echo "::error::UG7611 the AUR RPC reports '${served:-nothing}' instead of ${VERSION}-1"
              exit 1
            fi
            sleep 20
          done

  publish-crates:
    name: Publish to crates.io
    needs: [metadata, channel-preflight, stage]
    if: needs.channel-preflight.outputs.publish_crates == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
      - run: rustup show
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          # Only ugos-client lacks `publish = false`; cargo works out the order
          # itself. No retry loop and no `|| true`: a failed publish has to stop
          # the pipeline.
          cargo publish --workspace --locked
      - name: Check whether crates.io serves the version
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 600 ))
          while :; do
            found=$(curl -sS --max-time 30 -H 'User-Agent: ugos-cli release pipeline' \
              "https://crates.io/api/v1/crates/ugos-client/${VERSION}" \
              | jq -r 'try .version.num catch ""')
            if [[ "$found" == "$VERSION" ]]; then
              echo "::notice::crates.io serves ugos-client ${VERSION}"
              break
            fi
            if (( SECONDS > deadline )); then
              echo "::error::UG7700 crates.io does not serve ugos-client ${VERSION} within the deadline"
              exit 1
            fi
            sleep 20
          done

  # Stage 9. Promote. Only once every configured channel is through does the
  # prerelease become `latest`. The assets are not touched in the process.
  # A skipped channel does not block, a failed one does.
  promote:
    name: Promote to latest
    needs: [metadata, stage, update-homebrew, publish-aur, publish-crates]
    if: >-
      always()
      && needs.metadata.outputs.is_prerelease == 'false'
      && needs.stage.result == 'success'
      && needs.update-homebrew.result == 'success'
      && needs.publish-aur.result != 'failure'
      && needs.publish-crates.result != 'failure'
      && needs.publish-aur.result != 'cancelled'
      && needs.publish-crates.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Clear the prerelease flag and set latest
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          pre=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          [[ "$pre" == false && "$latest" == "$TAG" ]] || {
            echo "::error::UG7110 $TAG is not promoted (prerelease=$pre latest=$latest)"
            exit 1; }
          echo "::notice::$TAG is now latest"
