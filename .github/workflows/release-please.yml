name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please schreibt die Version nach Cargo.toml, fasst Cargo.lock
      # aber nicht an. Auf main laege das Lockfile dann eine Version zurueck und
      # jedes --locked in der CI scheitert. Der Push geht ausschliesslich auf den
      # PR-Branch, nie auf main, also entsteht keine Schleife. Mit dem App-Token
      # werden die Required Checks auf dem neuen Kopf der PR neu bewertet.
      - name: Cargo.lock in die Release-PR synchronisieren
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          branch=$(printf '%s' "$PR_JSON" | jq -r .headBranchName)
          git clone --branch "$branch" --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" rp-lock
          cd rp-lock
          rustup show
          cargo update --workspace -q
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock entspricht bereits der Release-Version."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: sync Cargo.lock to the release version" -- Cargo.lock
            git push origin "HEAD:$branch"
          fi

  publish-release:
    name: Publish release artifacts and package channels
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # Ein gerufener Workflow kann keine Berechtigung anfordern, die der
    # Aufrufer nicht hat; der Lauf scheitert sonst als startup_failure, ohne
    # Annotation und ohne Job. Die Signatur- und Attestierungsstufen brauchen
    # `id-token` und `attestations`, also stehen sie hier. Am Job und nicht am
    # Workflow, damit der release-please-Job selbst sie nicht bekommt.
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
