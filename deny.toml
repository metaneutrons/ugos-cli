# cargo-deny. Checks advisories, licences, duplicates and registries.
# Every entry under `ignore` needs a reason, the crate it concerns and the
# condition under which it gets removed again.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "Marvin attack; no patch available; pulled in through rsa; concerns decryption with a private key, and this client only encrypts with the NAS public key; remove as soon as rsa publishes a fixed version" },
]

[licenses]
version = 2
# Applications under GPL-3.0 add "GPL-3.0" to this list.
allow = [
    "GPL-3.0-or-later",  # this project itself
    "MPL-2.0",           # option-ext, through dirs; MPL 2.0 is GPL-3.0 compatible
    # webpki-roots. Permissive in substance, but there is no FSF statement on
    # GPL compatibility. Its content is a certificate list, not code.
    "CDLA-Permissive-2.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
