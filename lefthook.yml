# lefthook for Rust repositories. Goes into the root as `lefthook.yml`.
# Installation:
#   brew install lefthook   (oder: mise use -g lefthook)
#   lefthook install
# The scripts live under scripts/hooks/ and are manager-independent.

commit-msg:
  commands:
    conventional-commits:
      # {1} is the path to the commit message.
      run: sh scripts/hooks/check-commit-message.sh {1}

pre-commit:
  parallel: true
  commands:
    staged-guards:
      run: sh scripts/hooks/check-staged.sh
    secrets:
      run: gitleaks git --pre-commit --redact --staged --verbose
    # Formatting only: clippy compiles and blows the pre-commit budget.
    format:
      glob: "*.rs"
      run: cargo fmt --all -- --check
    toml-format:
      glob: "*.toml"
      run: taplo fmt --check
      skip: true   # auf false setzen, sobald taplo im Projekt genutzt wird

pre-push:
  parallel: false
  commands:
    secrets:
      run: sh scripts/hooks/check-push-secrets.sh
    # Measure once BEFORE enabling this:
    #   time cargo clippy --workspace --all-targets
    # Past 30 seconds the step does not belong in the hook but only in CI. The
    # result is to be measured per repository.
    clippy:
      # --all-features deliberately left out: it forces a full rebuild. The
      # complete matrix runs in CI.
      run: cargo clippy --workspace --all-targets -- -D warnings
    # Tests off by default. Switch them on only after measuring, because the
    # runtime varies more than clippy's does.
    tests:
      # Measured 2026-09-03: clippy 5.1 s + tests 5.0 s, about 10 s together.
      run: cargo nextest run --workspace
