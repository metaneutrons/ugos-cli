---
# Codacy analyses this repository server-side; this file only narrows what it
# looks at.
#
# CHANGELOG.md is generated by release-please and repeats "Features" and
# "Bug Fixes" per version by design, which markdownlint reports as duplicate
# headings. Editing it would be overwritten on the next release.
#
# The examples are throwaway debug helpers for probing the UGOS API by hand,
# not shipped code; their argument handling is flagged as if it were.
exclude_paths:
  - 'CHANGELOG.md'
  - 'crates/ugos-cli/examples/**'
  - 'target/**'
