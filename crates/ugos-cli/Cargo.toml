[package]
name = "ugos-cli"
description = "Command-line interface for UGOS NAS management"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["ugreen", "nas", "ugos", "cli", "kvm"]
categories = ["command-line-utilities"]
readme = "../../README.md"

# Only ugos-client goes to crates.io. Without this line a
# `cargo publish --workspace` would take the binaries along.
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tabled.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ugos-client = { path = "../ugos-client", version = "0.14.3" }
