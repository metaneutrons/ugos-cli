[package]
name = "ugos-mcp"
description = "MCP server exposing UGOS NAS operations as tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["ugreen", "nas", "ugos", "mcp", "kvm"]
categories = ["command-line-utilities", "api-bindings"]
readme = "../../README.md"
# Only ugos-client goes to crates.io. Without this line a
# `cargo publish --workspace` would take the binaries along. It belongs in
# [package]; under [[bin]] it is an unknown key that cargo merely reports as a
# warning and otherwise ignores.
publish = false

[[bin]]
name = "ugos-mcp"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
rmcp = { version = "3.1", features = ["server", "transport-io"] }
schemars = "1.2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ugos-client = { path = "../ugos-client", version = "0.14.2" }
