[package]
name = "ugos-mcp"
description = "MCP server exposing UGOS NAS operations as tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["ugreen", "nas", "ugos", "mcp", "kvm"]
categories = ["command-line-utilities", "api-bindings"]
readme = "../../README.md"

[[bin]]
name = "ugos-mcp"
path = "src/main.rs"

# Nur ugos-client geht nach crates.io. Ohne diese Zeile wuerde ein
# `cargo publish --workspace` die Binaerprogramme mitschicken.
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
rmcp = { version = "3.1", features = ["server", "transport-io"] }
schemars = "1.2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ugos-client = { path = "../ugos-client", version = "0.13.1" }
