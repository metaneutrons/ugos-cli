[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.14.2"
edition = "2024"
rust-version = "1.98"
# A deliberate departure from the repository standard, which prescribes
# LGPL-3.0-or-later for libraries. ugos-client stays on GPL-3.0-or-later like
# the binaries, decided by the owner. Two circumstances support that: the
# library serves this project's own applications, where the weaker copyleft adds
# nothing, and fourteen releases already stand under the GPL, so a switch would
# take effect only going forward and would split the history.
license = "GPL-3.0-or-later"
authors = ["Fabian Schmieder <fabian@schmieder.eu>"]
repository = "https://github.com/metaneutrons/ugos-cli"
homepage = "https://github.com/metaneutrons/ugos-cli"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_results = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Versions pulled in more than once arise purely transitively and cannot be
# resolved from here. cargo-deny runs the same check under [bans] and is the
# right place for it, because it names the culprit in the tree.
multiple_crate_versions = "allow"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
# Only for rebuilding a response whose body was read for the check. reqwest
# pulls http in anyway; it stands here because the code names the type
# directly.
http = "1"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "cookies", "multipart"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.11"
md-5 = "0.11"
aes-gcm = "0.11"
hex = "0.4"
rsa = "0.9"
base64 = "0.23"
tabled = { version = "0.21", default-features = false, features = ["std"] }
thiserror = "2"
dirs = "6"
der = "0.8"

[profile.release]
lto = true
strip = true
codegen-units = 1
