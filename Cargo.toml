[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.11.2"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
authors = ["Fabian Schmieder <fabian@schmieder.eu>"]
repository = "https://github.com/metaneutrons/ugos-cli"
homepage = "https://github.com/metaneutrons/ugos-cli"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_results = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Mehrfach eingebundene Versionen entstehen ausschliesslich transitiv und sind
# von hier nicht aufloesbar. cargo-deny fuehrt dieselbe Pruefung unter [bans]
# und ist dort der richtige Ort, weil es den Verursacher im Baum benennt.
multiple_crate_versions = "allow"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["rustls-tls", "json", "cookies", "multipart"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.11"
md-5 = "0.11"
aes-gcm = "0.10"
hex = "0.4"
rsa = "0.9"
base64 = "0.22"
tabled = { version = "0.17", default-features = false, features = ["std"] }
thiserror = "2"
dirs = "6"
der = "0.7"

[profile.release]
lto = true
strip = true
codegen-units = 1
